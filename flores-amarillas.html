/* ════════════════════════════════════════════════════════════════════
   Animales: cada uno es una sola pieza; patas, cola y alas se mueven en la GPU
   ════════════════════════════════════════════════════════════════════ */
function materialAnimal(){
  const m = new THREE.MeshLambertMaterial({ vertexColors: true });
  m.userData.u = { uPaso: { value: 0 }, uAndar: { value: 1 }, uAleteo: { value: 1 } };
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, m.userData.u);
    s.vertexShader = s.vertexShader.replace('#include <common>', `#include <common>
      attribute vec4 aPierna; attribute float aFaseI; uniform float uPaso; uniform float uAndar; uniform float uAleteo;`)
    .replace('#include <begin_vertex>', `
      vec3 transformed = position;
      float paso = uPaso + aFaseI;
      vec3 q = transformed - vec3(0., aPierna.z, aPierna.w);
      if (aPierna.x > .5 && aPierna.x < 1.5){            // patas: péndulo desde la cadera
        float a = sin(paso + aPierna.y) * .5 * uAndar, c = cos(a), s = sin(a);
        q = vec3(q.x, q.y * c - q.z * s, q.y * s + q.z * c);
        transformed = q + vec3(0., aPierna.z, aPierna.w);
      } else if (aPierna.x > 1.5 && aPierna.x < 2.5){    // cola: vaivén
        float a = sin(paso * .5) * .4, c = cos(a), s = sin(a);
        q = vec3(q.x * c + q.z * s, q.y, -q.x * s + q.z * c);
        transformed = q + vec3(0., aPierna.z, aPierna.w);
      } else if (aPierna.x > 2.5){                       // alas
        float a = (sin(paso) * .65 + .12) * uAleteo * aPierna.y, c = cos(a), s = sin(a);
        vec3 r = transformed - vec3(0., aPierna.z, 0.);
        transformed = vec3(r.x * c - r.y * s, r.x * s + r.y * c, r.z) + vec3(0., aPierna.z, 0.);
      }`);
  };
  m.customProgramCacheKey = () => 'animal';
  return m;
}

function pieza(g, colorFn, pierna = [0, 0, 0, 0]){
  if (g.attributes.uv) g.deleteAttribute('uv');
  if (g.attributes.aTinte) g.deleteAttribute('aTinte');
  if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), pie = new Float32Array(p.count * 4), c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    colorFn(p.getX(i), p.getY(i), p.getZ(i), c);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    pie.set(pierna, i * 4);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aPierna', new THREE.BufferAttribute(pie, 4));
  return g;
}
const liso = (hex) => { const k = new THREE.Color(hex); return (x, y, z, c) => c.copy(k); };

function ave({ cuerpo = '#4a3020', cabeza = '#f4f0e8', pico = '#f0b020', ala = '#4a3020', punta = '#20140c', cola = '#f4f0e8', envergadura = .75 } = {}){
  const partes = [];
  const b = new THREE.SphereGeometry(.12, 12, 8); b.scale(1, .9, 2.2); partes.push(pieza(b, liso(cuerpo)));
  const h = new THREE.SphereGeometry(.075, 10, 7); h.translate(0, .05, .27); partes.push(pieza(h, liso(cabeza)));
  const p = new THREE.ConeGeometry(.025, .08, 5); p.rotateX(Math.PI / 2); p.translate(0, .03, .36); partes.push(pieza(p, liso(pico)));
  for (const s of [-1, 1]){ const o = new THREE.SphereGeometry(.012, 5, 3); o.translate(s * .045, .07, .32); partes.push(pieza(o, liso('#0c0806'))); }
  const c = new THREE.ConeGeometry(.1, .24, 6); c.rotateX(-Math.PI / 2); c.scale(1, .22, 1); c.translate(0, 0, -.36); partes.push(pieza(c, liso(cola)));
  const cA = new THREE.Color(ala), cP = new THREE.Color(punta);
  for (const s of [-1, 1]){
    const w = petalo({ largo: envergadura, ancho: .17, copa: .02, caida: 0, segL: 5, segA: 2, forma: .55 });
    w.rotateY(s * Math.PI / 2); w.translate(s * .07, .03, 0);
    partes.push(pieza(w, (x, y, z, cc) => cc.copy(cA).lerp(cP, Math.min(1, Math.abs(x) / envergadura) ** 2), [3, s, .03, 0]));
  }
  return mergeGeometries(partes);
}

/* ── Animales de verdad: modelos 3D animados que se cargan aparte ── */
const R3 = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/';
const MODELOS = {
  loro:     { url: R3 + 'Parrot.glb',   largo: .75,  vel: 5,   vuela: true,  giro: 0 },
  jabiru:   { url: R3 + 'Stork.glb',    largo: 2.3,  vel: 6.5, vuela: true,  giro: 0 },   // el jabirú de los humedales
};
const PROTO = {};
const animales = [];
const cargadorGLB = new GLTFLoader();
function cargarModelo(tipo){
  return new Promise(res => cargadorGLB.load(MODELOS[tipo].url, g => {
    const caja = new THREE.Box3().setFromObject(g.scene), tam = caja.getSize(new THREE.Vector3());
    g.escala = MODELOS[tipo].largo / Math.max(tam.x, tam.z);
    g.scene.traverse(o => { if (o.isMesh){ o.frustumCulled = false; } });
    PROTO[tipo] = g; res(g);
  }, undefined, () => res(null)));
}

function crearAnimal(tipo){
  const p = PROTO[tipo], M = MODELOS[tipo];
  if (!p) return null;
  const modelo = M.piel ? SkeletonUtils.clone(p.scene) : p.scene.clone(true);
  modelo.scale.setScalar(p.escala); modelo.rotation.y = M.giro;
  const cuerpo = new THREE.Group(); cuerpo.add(modelo); cuerpo.rotation.order = 'YXZ';
  scene.add(cuerpo);
  const mixer = new THREE.AnimationMixer(modelo);
  let camina, quieto;
  if (tipo === 'zorro'){
    camina = mixer.clipAction(p.animations.find(a => a.name === 'Walk') || p.animations[0]);
    quieto = mixer.clipAction(p.animations.find(a => a.name === 'Survey') || p.animations[0]);
    quieto.play();
  } else camina = mixer.clipAction(p.animations[0]);
  camina.play(); camina.time = Math.random() * camina.getClip().duration;
  const a = { tipo, mesh: cuerpo, mixer, camina, quieto, escala: rango(.9, 1.1), centro: new THREE.Vector3(), radio: 5, ang: rnd() * 6.28,
    dir: rnd() < .5 ? 1 : -1, fase: rnd() * 6.28, alt: 0, nace: -100, vuela: M.vuela, libre: false };
  animales.push(a);
  return a;
}

async function poblarAnimales(){
  await Promise.all(Object.keys(MODELOS).map(cargarModelo));
  const Z = ZONA, f = esMovil ? .6 : 1;
  const lugar = (zona) => { const l = MUESTRAS_H.filter(m => m.zona === zona); return l[(rnd() * l.length) | 0]; };
  const poner = (tipo, m, lado, radio, alt = 0) => {
    const a = crearAnimal(tipo); if (!a) return null;
    a.centro.set(m.x + m.nx * lado, 0, m.z + m.nz * lado); a.radio = radio; a.alt = alt;
    return a;
  };
  const veces = (n) => Math.max(1, Math.round(n * f));
  // flamencos volando bajito sobre el río
  for (let i = 0; i < veces(6); i++) poner('jabiru', lugar(Z.RIO), rango(-3, 3), rango(14, 22), rango(4, 8));
  // loros de colores sobre el jardín y zorros entre las flores
  for (let i = 0; i < veces(11); i++) poner('loro', lugar(Z.FLORES), rango(-7, 7), rango(7, 14), rango(3.5, 9));
  for (let i = 0; i < veces(6); i++) poner('loro', lugar(Z.SABANA), rango(-10, 10), rango(10, 18), rango(5, 12));
  // cigüeñas planeando alrededor de la cima
  for (let i = 0; i < veces(2); i++) poner('jabiru', lugar(Z.CIMA), 0, rango(30, 45), rango(20, 32));
  // aves reales que acompañan al dron a un costado: se adelantan y se quedan atrás
  for (const [tipo, zonas, n, [y0, y1]] of [['loro', [Z.BOSQUE, Z.RIO, Z.FLORES, Z.SABANA], 4, [2.5, 6]], ['jabiru', [Z.RIO, Z.MAR], 3, [4, 8]]]){
    const lado = rnd() < .5 ? -1 : 1, grupo = rango(0, 25);
    for (let i = 0; i < veces(n); i++){
      const a = crearAnimal(tipo); if (!a) continue;
      a.ruta = { zonas, o0: grupo + i * rango(2, 4), a: rango(10, 20), w: rango(.08, .15), lado: lado * rango(5, 9), dy: rango(y0, y1) };
    }
  }
  // los que aparecen cuando ella toca
  const repertorio = ['jabiru', 'loro', 'loro', 'jabiru'];
  for (let i = 0; i < repertorio.length; i++){
    const a = crearAnimal(repertorio[i]); if (!a) continue;
    a.libre = true; a.mesh.visible = false;
  }
}

let sigAnimal = 0;
function aparecerAnimal(p, tipo = null){
  const libres = animales.filter(a => a.libre);
  if (!libres.length) return;
  const a = (tipo && libres.find(b => b.tipo === tipo && b.nace < 0)) || libres[sigAnimal++ % libres.length];
  a.centro.set(p.x, 0, p.z);
  a.radio = a.vuela ? rango(5, 8) : a.tipo === 'caballo' ? rango(6, 9) : rango(1.5, 3);
  a.alt = a.vuela ? rango(4, 8) : 0;
  a.nace = reloj.getElapsedTime(); a.mesh.visible = true;
}

const _ve2 = new THREE.Vector3(), _vt2 = new THREE.Vector3();
function escoltaReal(a, T, dt){
  const r = a.ruta, L = rutaDron.getLength(), d = r.o0 + Math.sin(T * r.w + a.fase) * r.a;
  const u = (((camK + d / L) % 1) + 1) % 1;
  const m = MUESTRAS_H[Math.floor(u * MUESTRAS_H.length) % MUESTRAS_H.length];
  if (!r.zonas.includes(m.zona)){ a.mesh.visible = false; return; }
  const p = rutaDron.getPointAt(u, _ve2), tg = rutaDron.getTangentAt(u, _vt2);
  const lado = r.lado + Math.sin(T * .4 + a.fase) * 1.5, x = p.x + m.nx * lado, z = p.z + m.nz * lado;
  a.mesh.visible = true;
  a.mesh.position.set(x, Math.max(p.y + r.dy + Math.sin(T * .9 + a.fase) * .6, Math.max(alturaH(x, z), NIVEL_MAR) + 2.8), z);
  a.mesh.rotation.set(0, Math.atan2(tg.x, tg.z), -Math.sin(T * .4 + a.fase) * .2);
  a.mesh.scale.setScalar(a.escala);
  a.mixer.update(dt);
}
function actualizarAnimal(a, T, dt){
  if (a.ruta) return escoltaReal(a, T, dt);
  if (a.libre && a.nace < 0) return;
  const M = MODELOS[a.tipo];
  const k = a.libre ? Math.min(1, (T - a.nace) / 1.4) : 1;
  // el zorro camina, se detiene a mirar, sigue; los caballos y las aves no paran
  const andar = a.tipo === 'zorro' ? THREE.MathUtils.smoothstep(Math.sin(T * .17 + a.fase), -.35, .15) : 1;
  a.ang += a.dir * M.vel * andar / a.radio * dt;
  const elip = a.vuela ? 1 : .7;
  const x = a.centro.x + Math.cos(a.ang) * a.radio, z = a.centro.z + Math.sin(a.ang) * a.radio * elip;
  const dx = x - camera.position.x, dz = z - camera.position.z;
  a.mesh.visible = dx * dx + dz * dz < (a.vuela ? 62500 : 12100) || k < 1;
  if (!a.mesh.visible) return;
  const despega = a.libre && a.vuela ? Math.min(1, (T - a.nace) / 3) : 1;          // las aves recién nacidas alzan vuelo
  const suelo = Math.max(alturaH(x, z), NIVEL_MAR);
  const y = a.vuela ? Math.max(suelo + .3 + (a.alt - .3) * despega + Math.sin(T * .6 + a.fase) * 1.2, suelo + (a.libre && despega < 1 ? .3 : 2.8)) : suelo;
  a.mesh.position.set(x, y, z);
  a.mesh.rotation.y = Math.atan2(-Math.sin(a.ang) * a.dir, Math.cos(a.ang) * a.dir * elip);
  a.mesh.rotation.z = a.vuela ? -a.dir * .25 : 0;
  const crece = k < 1 ? 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2) : 1;   // aparece con un rebote suave
  a.mesh.scale.setScalar(a.escala * Math.max(.001, crece));
  if (a.quieto){ a.camina.setEffectiveWeight(andar); a.quieto.setEffectiveWeight(1 - andar); }
  a.mixer.update(dt);
}

/* ── Una bandada de pajaritos cruzando el cielo ─────────────────── */
let bandada = null;
function crearBandada(){
  const n = esMovil ? 12 : 24;
  const geo = ave({ cuerpo: '#2a2a34', cabeza: '#2a2a34', pico: '#3a3a3a', ala: '#2a2a34', punta: '#15151c', cola: '#2a2a34', envergadura: .5 }).clone();
  const fases = new Float32Array(n); for (let i = 0; i < n; i++) fases[i] = rnd() * 6.28;
  geo.setAttribute('aFaseI', new THREE.InstancedBufferAttribute(fases, 1));
  const mat = materialAnimal();
  const m = new THREE.InstancedMesh(geo, mat, n); m.frustumCulled = false; scene.add(m);
  bandada = { m, mat, n, off: Array.from({ length: n }, (_, i) => new THREE.Vector3((i % 2 ? 1 : -1) * Math.ceil(i / 2) * 1.6, rango(-1, 1), -Math.ceil(i / 2) * 1.4)) };
}
const _bo = new THREE.Object3D();
function moverBandada(T, dt){
  if (!bandada) return;
  bandada.mat.userData.u.uPaso.value += dt * 11;
  const a = T * .045, cx = Math.cos(a) * 110, cz = Math.sin(a) * 90, dirx = -Math.sin(a), dirz = Math.cos(a) * .82;
  const rumbo = Math.atan2(dirx, dirz);
  for (let i = 0; i < bandada.n; i++){
    const o = bandada.off[i], c = Math.cos(rumbo), s = Math.sin(rumbo);
    _bo.position.set(cx + o.x * c + o.z * s + Math.sin(T * 1.3 + i) * .4, 42 + o.y + Math.sin(T * .8 + i) * .6, cz - o.x * s + o.z * c);
    _bo.rotation.set(0, rumbo, 0); _bo.scale.setScalar(.8); _bo.updateMatrix();
    bandada.m.setMatrixAt(i, _bo.matrix);
  }
  bandada.m.instanceMatrix.needsUpdate = true;
}

/* ── Árboles que crecen donde ella toca ─────────────────────────── */
function plantarArboles(p){
  const arboles = especies.filter(e => e.grupo === 'arbol' && e.extra > 0);
  // nunca encima de la cámara: si tocó muy cerca, el árbol nace unos metros más allá
  const cx = camera.position.x, cz = camera.position.z, dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz) || 1;
  if (d < 11){ p = p.clone(); p.x = cx + dx / d * 11; p.z = cz + dz / d * 11; }
  const zona = CERCA_H.zonaSuave(p.x, p.z);
  const opciones = zona === ZONA.SABANA ? arboles.filter(a => a.nombre === 'guanacaste') : arboles.filter(a => a.nombre !== 'guanacaste');
  if (!opciones.length) return;
  const n = 1 + (Math.random() * 3 | 0);
  for (let k = 0; k < n; k++){
    const e = opciones[Math.random() * opciones.length | 0];
    const r = k ? rango(3, 6) : rango(.5, 1.5), a = rnd() * 6.28, x = p.x + Math.cos(a) * r, z = p.z + Math.sin(a) * r;
    if (profundidadRio(x, z) > .2) continue;
    const i = e.siguiente++ % e.extra;
    e.reserva.count = Math.min(e.extra, e.siguiente);
    colocar(e.reserva, i, x, z, [e.escala[0] * .75, e.escala[1] * .85], false, .03);
    e.reserva.instanceMatrix.needsUpdate = true;
    const at = e.reserva.geometry.attributes.aNace; at.array[i] = U.uTime.value + k * .35; at.needsUpdate = true;
  }
}

/* ── Hojas y pétalos que vienen hacia ella, girando ─────────────── */
const _fw = new THREE.Vector3();
function moverHoja(d, dt, T){
  camera.getWorldDirection(_fw); _fw.y = 0; _fw.normalize();
  if (d.vy){ d.x += d.vx * dt; d.z += d.vz * dt; d.y += d.vy * dt; d.vy -= 2.6 * dt; d.vx *= .985; d.vz *= .985; if (d.vy < -d.v) d.vy = 0; }
  else {
    d.x += (-_fw.x * 1.6 + Math.sin(T * .6 + d.f) * .5) * dt;
    d.z += (-_fw.z * 1.6 + Math.cos(T * .5 + d.f) * .5) * dt;
    d.y -= (d.v * .35 + Math.sin(T * 1.3 + d.f) * .15) * dt;
  }
  d.rx += dt * 2.4 * d.v; d.rz += dt * 1.7;
  const rx = d.x - camera.position.x, rz = d.z - camera.position.z;
  if (!d.vy && (rx * _fw.x + rz * _fw.z < -3 || rx * rx + rz * rz > 900 || d.y < alturaH(d.x, d.z))){
    const lado = rango(-12, 12), dist = rango(6, 28);
    d.x = camera.position.x + _fw.x * dist - _fw.z * lado;
    d.z = camera.position.z + _fw.z * dist + _fw.x * lado;
    d.y = camera.position.y + rango(-1.5, 5);
  }
}

/* ── Cada cuadro: animales, bandada, rayos, lejanía, frases y sonido del río ── */
let cuadroCull = 0, zonaCam = -1, ultimoRio = -1, ultimoMar = -1;
const LUZ = HUELLA ? {
  solDia: SOL_DIR.clone(), solTarde: new THREE.Vector3(-1, .07, -.55).normalize(),
  colDia: new THREE.Color('#fff0d8'), colTarde: new THREE.Color('#ff9a4a'),
  cieloDia: new THREE.Color('#dcecff'), cieloTarde: new THREE.Color('#ffc09a'),
  nieblaDia: new THREE.Color('#cfe0f2'), nieblaTarde: new THREE.Color('#e0906a'),
} : null;
function moverLuz(dt){
  U_TARDE.value += (TARDE_ZONA[zonaCam] - U_TARDE.value) * Math.min(1, dt * .1);
  const k = U_TARDE.value;
  SOL_DIR.copy(LUZ.solDia).lerp(LUZ.solTarde, k).normalize();
  sol.position.copy(SOL_DIR).multiplyScalar(100);
  sol.color.copy(LUZ.colDia).lerp(LUZ.colTarde, k); sol.intensity = 2.4 - .4 * k;
  hemi.color.copy(LUZ.cieloDia).lerp(LUZ.cieloTarde, k); hemi.intensity = 1.15 - .25 * k;
  scene.fog.color.copy(LUZ.nieblaDia).lerp(LUZ.nieblaTarde, k);
  renderer.toneMappingExposure = .95 - .3 * k;                 // al caer la tarde, la cámara cierra un poco: colores más intensos
  bloom.strength = .38 - .08 * k;
}
function actualizarHuella(T, dt){
  for (const a of animales) actualizarAnimal(a, T, dt);
  for (const b of aves) actualizarAve(b, T, dt);
  moverNeblina(T);
  moverBandada(T, dt);
  for (const r of rayos){
    r.r.rotation.y = Math.atan2(camera.position.x - r.r.position.x, camera.position.z - r.r.position.z);
    r.r.rotation.z = -.3;
    r.r.material.opacity = r.base * (.6 + .4 * Math.sin(T * .4 + r.f));
  }
  if (++cuadroCull % 4 === 0){
    const cp = camera.position;
    for (const m of CULL){ const s = m.boundingSphere || m.geometry.boundingSphere; m.visible = cp.distanceTo(s.center) < m.userData.lejos + s.radius; }
  }
  zonaCam = CERCA_H.zona(camera.position.x, camera.position.z);
  moverLuz(dt);
  if (olasMar) olasMar.visible = camera.position.x < -45;      // las olas solo se calculan cerca de la costa
  const rio = zonaCam === ZONA.RIO ? 1 : 0;
  if (rio !== ultimoRio){ ultimoRio = rio; sonar.rio(rio); }
  const mar = zonaCam === ZONA.MAR ? 1 : 0;
  if (mar !== ultimoMar){ ultimoMar = mar; sonar.mar(mar); }

}

/* ── Gigante del bosque (ceiba / higuerón): raíces tablares, bejucos y bromelias ── */
function crearGigante(){
  const partes = [];
  const perfil = [[.085, 0], [.052, .03], [.038, .08], [.031, .2], [.028, .42], [.024, .6]].map(([r, y]) => new THREE.Vector2(r, y));
  partes.push(pintar(jitter(new THREE.LatheGeometry(perfil, 9), .08), '#56503a', '#6e6450'));
  for (let i = 0; i < 5; i++){                                       // raíces tablares
    const f = petalo({ largo: .11, ancho: .045, copa: 0, caida: 0, segL: 2, segA: 1, forma: .6, base: '#5a5240', tip: '#6a6048', tinte: 0 });
    f.rotateX(-Math.PI / 2 + .55); f.rotateY(i / 5 * Math.PI * 2 + .3); f.rotateZ(Math.PI / 2); f.translate(0, .01, 0);
    partes.push(f);
  }
  const puntas = [];
  for (let i = 0; i < 5; i++){                                       // ramas maestras
    const a = i / 5 * Math.PI * 2 + hash(i, 7) * .5, inc = .75 + hash(i, 3) * .3, largo = .2 + hash(i, 5) * .07, y0 = .5 + hash(i, 9) * .08;
    const r = new THREE.CylinderGeometry(.009, .016, largo, 6); r.translate(0, largo / 2, 0); r.rotateZ(-inc); r.rotateY(a); r.translate(0, y0, 0);
    partes.push(pintar(r, '#5a5240', '#6a6a48'));
    puntas.push(new THREE.Vector3(Math.cos(a) * Math.sin(inc) * largo, y0 + Math.cos(inc) * largo, -Math.sin(a) * Math.sin(inc) * largo));
  }
  for (const [k, p] of puntas.entries()){                            // copas en racimo
    for (let j = 0; j < 2; j++){
      const c = jitter(new THREE.IcosahedronGeometry(.12 + hash(k, j) * .05, 1), .25); c.scale(1, .5, 1);
      c.translate(p.x + (hash(k, j + 4) - .5) * .1, p.y + .03 + j * .04, p.z + (hash(k, j + 8) - .5) * .1);
      partes.push(pintar(c, '#8e9e86', '#f0f4ea', 'y', 1));
    }
    const b = new THREE.ConeGeometry(.012, .02, 5); b.translate(p.x * .7, p.y - .04, p.z * .7); partes.push(pintar(b, '#c8281a', '#5a8a2a'));   // bromelia
    for (let v = 0; v < 2; v++){                                     // bejucos colgando
      const largoV = .14 + hash(k, v + 11) * .16, lv = new THREE.CylinderGeometry(.0016, .0016, largoV, 3);
      lv.translate(p.x * (.6 + v * .25), p.y - .02 - largoV / 2, p.z * (.6 + v * .25)); partes.push(pintar(lv, '#4a5a2a', '#5a6a32'));
    }
  }
  const top = jitter(new THREE.IcosahedronGeometry(.17, 1), .25); top.scale(1, .5, 1); top.translate(0, .8, 0);
  partes.push(pintar(top, '#8e9e86', '#f0f4ea', 'y', 1));
  return mergeGeometries(partes);
}
/* ── Roble de copa redonda, con bejucos ── */

/* ── Guarumo: tronco blanquecino y hojas palmeadas plateadas ── */

/* ── Palma ── */

/* ── Heliconia (platanilla): hojas de remo y brácteas en zigzag ── */

const _ve = new THREE.Vector3(), _vt = new THREE.Vector3();
function moverEscolta(b, T, dt){
  const r = b.ruta, L = rutaDron.getLength();
  const d = r.o0 + Math.sin(T * r.w + b.fase) * r.a;
  const u = (((camK + d / L) % 1) + 1) % 1;

  if (!r.zonas.includes(m.zona)){ b.mesh.visible = false; return; }
  const p = rutaDron.getPointAt(u, _ve), tg = rutaDron.getTangentAt(u, _vt);

  b.mat.userData.u.uPaso.value += dt * b.o.aleteo;
}
function actualizarAve(b, T, dt){
  if (b.ruta) return moverEscolta(b, T, dt);
  if (b.libre && b.nace < 0) return;
  const o = b.o, k = b.libre ? Math.min(1, (T - b.nace) / 1.4) : 1;
  let x, z, y, rumbo;
  if (o.flota){
    // colibrí: suspendido frente a las flores, de pronto salta a otra y vuelve a quedarse quieto
    const salto = Math.floor(T * .45 + b.fase), s1 = hash(salto, b.fase * 13), s2 = hash(salto + 7, b.fase * 5);
    const tx = b.centro.x + (s1 - .5) * 1.8, tz = b.centro.z + (s2 - .5) * 1.8;
    b.px += (tx - b.px) * Math.min(1, dt * 5); b.pz += (tz - b.pz) * Math.min(1, dt * 5);
    if (!b.px && !b.pz){ b.px = tx; b.pz = tz; }
    x = b.px; z = b.pz; y = alturaH(x, z) + b.alt * (b.libre ? .4 + .6 * k : 1) + Math.sin(T * 3 + b.fase) * .04;
    rumbo = Math.atan2(b.centro.x - x, b.centro.z - z) + Math.sin(T * .9 + b.fase) * .6;
    b.mat.userData.u.uAleteo.value = .9;
  } else {
    b.ang += b.dir * o.vel / b.radio * dt;
    x = b.centro.x + Math.cos(b.ang) * b.radio; z = b.centro.z + Math.sin(b.ang) * b.radio;
    const despega = b.libre ? Math.min(1, (T - b.nace) / 3) : 1;
    y = Math.max(alturaH(x, z), NIVEL_MAR) + .5 + (b.alt - .5) * despega + Math.sin(T * .8 + b.fase) * .6;
    y = Math.max(y, Math.max(alturaH(x, z), NIVEL_MAR) + (b.libre && despega < 1 ? .3 : 2.5));
    rumbo = Math.atan2(-Math.sin(b.ang) * b.dir, Math.cos(b.ang) * b.dir);
    b.mat.userData.u.uAleteo.value = .35 + .65 * Math.max(0, Math.sin(T * .45 + b.fase));   // aletea y planea
  }
  const dx = x - camera.position.x, dz = z - camera.position.z;
  const d2 = dx * dx + dz * dz + (y - camera.position.y) ** 2;
  b.mesh.visible = (d2 < (o.flota ? 1600 : 32400) && (o.flota || d2 > 100)) || k < 1;
  if (!b.mesh.visible) return;
  b.mesh.position.set(x, y, z);
  b.mesh.rotation.y = rumbo; b.mesh.rotation.z = o.flota ? 0 : -b.dir * .3;
  b.mesh.rotation.x = o.flota ? -.5 : 0;
  const crece = k < 1 ? 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2) : 1;
  b.mesh.scale.setScalar(Math.max(.001, crece));

}

/* ════════════════════════════════════════════════════════════════════
   Zacate: cientos de miles de hojas individuales, con su propio shader
   (base en sombra, puntas claras, contraluz dorado y viento en olas)
   ════════════════════════════════════════════════════════════════════ */
const HOJAS = Math.floor(HUELLA ? (esMovil ? 75000 : 280000) : (esMovil ? 90000 : 240000));
const zacate = (() => {
  // plantilla de una hoja: x ∈ [-.5,.5] ancho, y ∈ [0,1] alto
  const SEG = 4, pos = [], idx = [];
  for (let i = 0; i < SEG; i++){ const y = i / SEG; pos.push(-.5, y, 0, .5, y, 0); }
  pos.push(0, 1, 0);
  for (let i = 0; i < SEG - 1; i++){ const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const u = (SEG - 1) * 2; idx.push(u, u + 1, u + 2);
  const plantilla = new THREE.Float32BufferAttribute(pos, 3), indice = new THREE.Uint16BufferAttribute(idx, 1);

  // se reparte por parcelas, más tupido donde pasa el dron
  const cub = Array.from({ length: GRID * GRID }, () => ({ off: [], par: [], v: [], s: [] }));
  let n = 0, intentos = 0;
  while (n < HOJAS && intentos < HOJAS * 8){
    intentos++;
    let x, z, alto = 1, seco = 0;
    if (HUELLA){
      // sigue el viaje: dorado y alto en la sabana, ralo bajo los árboles, nada en el agua ni en la roca
      const m = MUESTRAS_H[(rnd() * MUESTRAS_H.length) | 0], off = (rnd() * 2 - 1) * (rnd() < .65 ? 14 : 34);
      x = m.x + m.nx * off; z = m.z + m.nz * off;
      const zn = CERCA_H.zonaSuave(x, z);
      if (profundidadRio(x, z) > .3 || alturaH(x, z) > 40) continue;
      if (x < -60){ const c = costaDe(x, z); if (c > -58 || (c > -98 && rnd() < THREE.MathUtils.smoothstep(c, -98, -58))) continue; }
      if ((zn === ZONA.BOSQUE ? .35 : zn === ZONA.CIMA ? .6 : 1) < rnd()) continue;
      if (zn === ZONA.SABANA){ alto = 1.7; seco = .75 + rnd() * .25; } else if (zn === ZONA.CIMA) seco = .25;
    } else {
      const r = Math.sqrt(rnd()) * 66, a = rnd() * Math.PI * 2;
      x = Math.cos(a) * r; z = Math.sin(a) * r;
      const densidad = THREE.MathUtils.smoothstep(CERCA(x, z), 18, 4) * .9 + .1;
      if (densidad < rnd()) continue;
    }
    const c = cub[celda(x, z)], mancha = fbm(x * .12 + 50, z * .12);
    c.off.push(x, altura(x, z) - .02, z);
    c.par.push(rnd() * Math.PI * 2, (.32 + rnd() * .5) * (.75 + mancha * .6) * alto, .032 + rnd() * .026, .15 + rnd() * .55);
    c.v.push(rnd() * .7 + mancha * .3);
    c.s.push(seco);
    n++;
  }
  const m = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, fog: true,
    uniforms: { ...THREE.UniformsLib.fog, uTime: U.uTime, uViento: U.uViento, uSol: { value: SOL_DIR } },
    vertexShader: `
      attribute vec3 aOff; attribute vec4 aPar; attribute float aVar; attribute float aSeco; varying float vSeco;
      uniform float uTime; uniform float uViento; uniform vec3 uSol;
      varying float vY; varying float vVar; varying vec3 vN; varying vec3 vVista; varying float vX;
      #include <fog_pars_vertex>
      void main(){
        float y = position.y, ang = aPar.x, h = aPar.y, w = aPar.z;
        vec3 frente = vec3(cos(ang), 0., sin(ang));
        vec3 lado = vec3(-frente.z, 0., frente.x);
        float ola = sin(uTime * .9 - aOff.x * .11 + aOff.z * .05) * .5 + .5;
        float rafaga = sin(uTime * 1.9 + aOff.x * .7 + aOff.z * .4 + aVar * 6.) * .25;
        float viento = (ola * .75 + rafaga + .15) * uViento;
        float doblez = (aPar.w + viento * .6) * y * y;
        vec3 p = aOff + lado * position.x * w * (1. - pow(y, 1.4) * .92);
        p += frente * aPar.w * y * y * h * .5;
        p += vec3(.85, 0., .35) * viento * y * y * h * .55;
        p.y += h * y * (1. - doblez * .25);
        vN = normalize(frente * .6 + vec3(0., .55, 0.) + lado * position.x * 1.4);
        vY = y; vVar = aVar; vX = position.x; vSeco = aSeco;
        vVista = normalize(cameraPosition - p);
        vec4 mvPosition = viewMatrix * vec4(p, 1.);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform vec3 uSol;
      varying float vY; varying float vVar; varying vec3 vN; varying vec3 vVista; varying float vX; varying float vSeco;
      #include <fog_pars_fragment>
      void main(){
        vec3 base = vec3(.035, .07, .012);
        vec3 medio = mix(vec3(.1, .24, .03), vec3(.17, .3, .035), vVar);
        vec3 punta = mix(vec3(.3, .5, .08), vec3(.5, .56, .12), smoothstep(.55, 1., vVar));
        punta = mix(punta, vec3(.78, .62, .28), step(.93, vVar));          // alguna hoja seca, dorada
        medio = mix(medio, vec3(.36, .3, .1), vSeco); punta = mix(punta, vec3(.86, .72, .36), vSeco);
        vec3 c = mix(base, medio, smoothstep(0., .45, vY));
        c = mix(c, punta, smoothstep(.4, 1., vY));
        c *= .85 + .3 * (1. - abs(vX) * 1.6);                               // nervio central
        vec3 n = normalize(gl_FrontFacing ? vN : -vN);
        float dif = max(dot(n, uSol), 0.) * .55 + .6;
        float contra = pow(max(dot(-vVista, uSol), 0.), 3.) * smoothstep(.2, 1., vY);   // sol a través de la hoja
        vec3 luz = c * dif * vec3(1.25, 1.05, .8);
        luz += vec3(1., .66, .22) * contra * (.4 + vVar * .4) * .7;
        gl_FragColor = vec4(luz, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`
  });
  const trozos = [];
  cub.forEach((c, k) => {
    const cuantas = c.v.length; if (!cuantas) return;
    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute('position', plantilla); g.setIndex(indice);
    g.setAttribute('aOff', new THREE.InstancedBufferAttribute(new Float32Array(c.off), 3));
    g.setAttribute('aPar', new THREE.InstancedBufferAttribute(new Float32Array(c.par), 4));
    g.setAttribute('aVar', new THREE.InstancedBufferAttribute(new Float32Array(c.v), 1));
    g.setAttribute('aSeco', new THREE.InstancedBufferAttribute(new Float32Array(c.s), 1));
    g.instanceCount = cuantas;
    const cx = (k % GRID + .5) * LADO - MUNDO_L, cz = (Math.floor(k / GRID) + .5) * LADO - MUNDO_L;
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(cx, altura(cx, cz), cz), LADO * .75 + 3);
    const mesh = new THREE.Mesh(g, m); mesh.userData.n0 = cuantas; mesh.userData.lejos = 48; scene.add(mesh); trozos.push(mesh);
    if (HUELLA) CULL.push(mesh);
  });
  return { trozos };
})();

const POLEN = esMovil ? 700 : 1800;
const polen = (() => {
  const pos = new Float32Array(POLEN * 3), sem = new Float32Array(POLEN);
  for (let i = 0; i < POLEN; i++){ pos[i*3] = rango(-35, 35); pos[i*3+1] = rango(0, 7); pos[i*3+2] = rango(-35, 35); sem[i] = rnd() * 100; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSem', new THREE.BufferAttribute(sem, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uCam: { value: new THREE.Vector3() }, uPx: { value: innerHeight * pr } },
    vertexShader: `
      attribute float aSem; uniform float uTime; uniform vec3 uCam; uniform float uPx; varying float vA;
      void main(){
        vec3 p = position;
        p.x += sin(uTime * 0.3 + aSem) * 1.5 + uTime * 0.25;
        p.y = mod(p.y + uTime * 0.12 + sin(uTime + aSem) * 0.2, 7.0) + 0.2;
        p.z += cos(uTime * 0.25 + aSem * 1.3) * 1.5;
        p.xz = uCam.xz + mod(p.xz - uCam.xz + 35.0, 70.0) - 35.0;
        vec4 mv = modelViewMatrix * vec4(p, 1.);
        gl_Position = projectionMatrix * mv;
        float tw = 0.55 + 0.45 * sin(uTime * 2.3 + aSem * 7.0);
        gl_PointSize = (0.06 + 0.05 * fract(aSem)) * uPx / -mv.z;
        vA = tw * smoothstep(40.0, 5.0, -mv.z);
      }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - .5); float a = smoothstep(.5, 0., d); gl_FragColor = ${HUELLA ? 'vec4(1.0, .98, .95, a * a * vA * .85)' : 'vec4(1.0, .85, .45, a * a * vA)'}; }`
  });
  const p = new THREE.Points(g, m); p.frustumCulled = false; scene.add(p);
  return m;
})();

let yawUsr = 0, pitchUsr = 0, yawObj = 0, pitchObj = 0;
let arrastrando = false, px0 = 0, py0 = 0, movido = 0, rastro = 0;
canvas.addEventListener('pointerdown', e => { arrastrando = true; px0 = e.clientX; py0 = e.clientY; movido = 0; });
addEventListener('pointermove', e => {
  if (!arrastrando) return;
  const dx = e.clientX - px0, dy = e.clientY - py0; px0 = e.clientX; py0 = e.clientY; movido += Math.abs(dx) + Math.abs(dy);
  yawObj -= dx * .004; pitchObj = THREE.MathUtils.clamp(pitchObj - dy * .003, -.5, .45);
  if (HUELLA && listo){ rastro += Math.abs(dx) + Math.abs(dy); if (rastro > 38){ rastro = 0; tocar(e.clientX, e.clientY, true); } }   // su huella: un rastro de flores
});
addEventListener('pointerup', e => { if (arrastrando && movido < 10) tocar(e.clientX, e.clientY); arrastrando = false; });

const _v = new THREE.Vector3(), _t = new THREE.Vector3(), _mira = new THREE.Vector3(), _dir = new THREE.Vector3(0, -.3, -1);
const VUELTA = HUELLA ? rutaDron.getLength() / 4.3 : 85;   // en la huella, un viaje de unos minutos                               // segundos por vuelta completa
let rumboPrev = null, alabeo = 0, camY = null, camK = 0, miradaMar = 0;
function moverCamara(t, dt){
  // el dron frena suavecito al pasar rasante y acelera en lo alto
  const k = (t / VUELTA + .0001) % 1;
  camK = k;
  const pos = rutaDron.getPointAt(k, _v);
  const ade = rutaDron.getPointAt((k + .014) % 1, _t);
  if (HUELLA){ pos.y = Math.max(pos.y, alturaBaseH(pos.x, pos.z) + 3.4); ade.y = Math.max(ade.y, alturaBaseH(ade.x, ade.z) + 3.4); }   // el dron sigue el relieve
  const dir = ade.sub(pos).normalize();
  const alto = pos.y - altura(pos.x, pos.z);
  dir.y = dir.y * (HUELLA ? .85 : .45) - .07 - Math.max(0, Math.min(alto - 3, HUELLA ? 8 : 99)) * .022;          // mira hacia abajo cuando va alto
  if (HUELLA){ miradaMar += ((zonaCam === ZONA.MAR ? 1 : 0) - miradaMar) * Math.min(1, dt * .3); dir.x -= 1.5 * miradaMar; dir.z += .3 * miradaMar; }   // en la playa, la mirada se va despacio hacia el mar
  dir.normalize();
  _dir.lerp(dir, Math.min(1, dt * (HUELLA ? 1.2 : 2.2))).normalize();
  // alabeo en las curvas, como un dron de verdad
  const rumbo = Math.atan2(_dir.x, _dir.z);
  if (rumboPrev !== null && dt > 0){
    let d = rumbo - rumboPrev; if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
    const lim = HUELLA ? .1 : .22, obj = THREE.MathUtils.clamp(-d / dt * (HUELLA ? .15 : .22), -lim, lim);
    alabeo += (obj - alabeo) * Math.min(1, dt * 1.5);
  }
  rumboPrev = rumbo;
  pos.y = Math.max(pos.y, altura(pos.x, pos.z) + 2.3);
  if (HUELLA){ camY = camY === null ? pos.y : camY + (pos.y - camY) * Math.min(1, dt * 2.5); pos.y = camY; }   // sin brincos
  yawUsr += (yawObj - yawUsr) * Math.min(1, dt * 4);
  pitchUsr += (pitchObj - pitchUsr) * Math.min(1, dt * 4);
  if (!arrastrando){ yawObj *= Math.pow(.35, dt * .15); pitchObj *= Math.pow(.35, dt * .15); }
  const mira = _dir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), yawUsr); mira.y += pitchUsr;
  const vaiven = reduceMov ? 0 : Math.sin(t * .7) * .06;
  camera.position.set(pos.x, pos.y + vaiven, pos.z);
  _mira.copy(camera.position).add(mira);
  camera.lookAt(_mira);
  if (!reduceMov) camera.rotateZ(alabeo);
}

/* ════════════════════════════════════════════════════════════════════
   Tocar la pradera = nace un ramillete
   ════════════════════════════════════════════════════════════════════ */
const ray = new THREE.Raycaster();
const plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let sembradas = 0;
let pasos = 0;
function tocar(cx, cy, huella = false){
  if (!listo) return;
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  // marcha sobre el rayo hasta tocar el suelo (solo cerca, para que se vean nacer)
  const o = ray.ray.origin, d = ray.ray.direction; let hit = null;
  for (let s = 0.5; s < 28; s += .2){ const x = o.x + d.x * s, y = o.y + d.y * s, z = o.z + d.z * s; if (y <= altura(x, z)){ hit = new THREE.Vector3(x, y, z); break; } }
  if (!hit && huella) return;
  if (!hit){
    // tocó el cielo o el horizonte: el ramillete nace igual, frente a la cámara
    const h = new THREE.Vector3(d.x, 0, d.z);
    if (h.lengthSq() < 1e-4){ camera.getWorldDirection(h); h.y = 0; }
    h.normalize();
    const dist = 8 + Math.random() * 4;
    const x = o.x + h.x * dist, z = o.z + h.z * dist;
    hit = new THREE.Vector3(x, altura(x, z), z);
  }
  if (HUELLA && profundidadRio(hit.x, hit.z) > .25){
    if (huella) return;
    soltarMariposas(hit, 5); aparecerAnimal(hit, 'jabiru'); sonar.campanita(); destello(hit); return;
  }
  const cuantas = huella ? 7 : HUELLA ? 16 : 34;
  const flores = especies.filter(e => e.grupo === 'flor' && e.extra > 0);
  for (let k = 0; k < cuantas; k++){
    const e = flores[(rnd() * flores.length) | 0];
    const i = e.siguiente++ % e.extra;                          // si se llena, recicla las más viejas
    e.reserva.count = Math.min(e.extra, e.siguiente);
    const r = Math.sqrt(rnd()) * (huella ? .7 : 1.4), a = rnd() * 6.28;
    const [e0, e1] = e.escala;
    colocar(e.reserva, i, hit.x + Math.cos(a) * r, hit.z + Math.sin(a) * r, [e0 * 1.25, e1 * 1.35], e.mirarSol, e.inclinar);
    e.reserva.instanceMatrix.needsUpdate = true;
    const at = e.reserva.geometry.attributes.aNace;
    at.array[i] = U.uTime.value + r * .25 + rnd() * .35; at.needsUpdate = true;
  }
  if (huella){ sembradas += cuantas; if (++pasos % 3 === 0) sonar.campanita(true); if (Math.random() < .3) soltarMariposas(hit, 1); return; }
  chorroPetalos(hit);
  sembradas += cuantas;
  chorroPetalos(hit);
  sonar.campanita();
  destello(hit);
  if (HUELLA){                                   // además de flores: un árbol, mariposas o un animal
    const r = Math.random();
    if (r < .28) plantarArboles(hit); else if (r < .46) soltarMariposas(hit, 5); else if (r < .74) aparecerAve(hit); else aparecerAnimal(hit);
  }
}

// chispa de luz donde se siembra
const chispas = [];
let chorro = 0;
function chorroPetalos(p){
  const { datos } = petalosVuelo;
  for (let n = 0; n < 40; n++){
    const d = datos[chorro++ % datos.length];
    d.x = p.x + rango(-.4, .4); d.z = p.z + rango(-.4, .4); d.y = p.y + .3;
    d.vy = rango(2.2, 4.2); d.vx = rango(-1.2, 1.2); d.vz = rango(-1.2, 1.2);
  }
}
function destello(p){
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: texBrillo, color: '#ffd46a', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.copy(p).add(new THREE.Vector3(0, .4, 0)); m.scale.setScalar(.1); scene.add(m);
  chispas.push({ m, t: 0 });
}
const texBrillo = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(.3, 'rgba(255,220,140,.6)'); g.addColorStop(1, 'rgba(255,200,80,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

/* ════════════════════════════════════════════════════════════════════
   Música generativa (Web Audio) — y, si existe, la voz de él (voz.mp3)
   ════════════════════════════════════════════════════════════════════ */
const sonar = (() => {
  let ctx, master, mezcla, rev, activo = true, empezado = false, voz = null;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const BEAT = HUELLA ? 60 / 56 : 60 / 68;                                   // 68 pulsos por minuto, calmado

  // Re mayor: I – V – vi – IV – I – V – IV – V
  // La huella — Fa mayor: Fmaj7 – Am7 – Bbmaj7 – C – Dm7 – Am7 – Bbmaj7 – Csus
  const ACORDES_H = [
    { r: 41, t: [57, 64, 69] }, { r: 45, t: [60, 64, 67] }, { r: 46, t: [62, 65, 69] }, { r: 48, t: [62, 64, 67] },
    { r: 50, t: [60, 65, 69] }, { r: 45, t: [60, 64, 67] }, { r: 46, t: [62, 65, 69] }, { r: 48, t: [65, 67, 72] },
  ];
  const MELODIA_H = [
    [[72, 2], [69, 1], [67, 1]],
    [[69, 3], [64, 1]],
    [[65, 2], [69, 1], [72, 1]],
    [[74, 3], [72, 1]],
    [[77, 2], [76, 1], [74, 1]],
    [[72, 3], [69, 1]],
    [[70, 1], [69, 1], [67, 1], [65, 1]],
    [[67, 4]],
  ];
  const ACORDES = HUELLA ? ACORDES_H : [
    { r: 50, t: [62, 66, 69] }, { r: 45, t: [61, 64, 69] }, { r: 47, t: [62, 66, 71] }, { r: 43, t: [62, 67, 71] },
    { r: 50, t: [62, 66, 69] }, { r: 45, t: [61, 64, 69] }, { r: 43, t: [59, 62, 67] }, { r: 45, t: [61, 64, 69] },
  ];
  // melodía por compás: [nota midi, pulsos]
  const MELODIA = HUELLA ? MELODIA_H : [
    [[78, 2], [76, 1], [74, 1]],
    [[76, 3], [69, 1]],
    [[74, 2], [73, 1], [71, 1]],
    [[71, 1.5], [69, .5], [67, 1], [69, 1]],
    [[78, 1], [81, 1], [78, 1], [76, 1]],
    [[76, 2], [73, 1], [76, 1]],
    [[74, 1], [71, 1], [74, 1], [79, 1]],
    [[78, 2], [76, 2]],
  ];
  const CONTRA = HUELLA ? [84, 84, 81, 79, 86, 84, 82, 79] : [86, 85, 83, 83, 86, 88, 86, 85];

  function reverb(seg = 5.5){
    const len = ctx.sampleRate * seg, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const cv = ctx.createConvolver(); cv.buffer = b; return cv;
  }
  function salida(pan, seco, humedo){
    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
    if (p.pan) p.pan.value = pan;
    const gs = ctx.createGain(); gs.gain.value = seco; const gh = ctx.createGain(); gh.gain.value = humedo;
    p.connect(gs); gs.connect(mezcla); p.connect(gh); gh.connect(rev);
    return p;
  }
  // piano suave: armónicos que se apagan a distinto ritmo + filtro que se va cerrando
  function piano(m, t, vel = .5, pan = 0, largo = 1){
    const f = hz(m), dur = (3.2 - (m - 50) * .03) * largo;
    const out = salida(pan, .8, .55);
    const filtro = ctx.createBiquadFilter(); filtro.type = 'lowpass';
    filtro.frequency.setValueAtTime(Math.min(f * 9, 9000), t); filtro.frequency.exponentialRampToValueAtTime(Math.max(f * 1.6, 300), t + dur * .8);
    filtro.connect(out);
    [[1, 1, 1], [2, .42, .55], [3, .16, .35], [4, .08, .25], [6, .03, .15]].forEach(([k, a, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f * k * (1 + (k - 1) * .0009); o.detune.value = (Math.random() - .5) * 3;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel * a * .16, t + .006);
      g.gain.exponentialRampToValueAtTime(.00008, t + dur * d);
      o.connect(g); g.connect(filtro); o.start(t); o.stop(t + dur + .1);
    });
  }
  // colchón de cuerdas cálidas
  function cuerdas(notas, t, dur, vol = .05){
    const out = salida(0, .6, .9);
    const filtro = ctx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.Q.value = .4;
    filtro.frequency.setValueAtTime(500, t); filtro.frequency.linearRampToValueAtTime(1300, t + dur * .5); filtro.frequency.linearRampToValueAtTime(600, t + dur);
    filtro.connect(out);
    const g = ctx.createGain(); g.connect(filtro);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .4); g.gain.linearRampToValueAtTime(0, t + dur + .8);
    notas.forEach(m => [-7, 0, 6].forEach(dt => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = dt;
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 4.8 + Math.random(); lg.gain.value = 4;
      lfo.connect(lg); lg.connect(o.detune);
      o.connect(g); o.start(t); o.stop(t + dur + 1); lfo.start(t); lfo.stop(t + dur + 1);
    }));
  }
  // campanitas (celesta)
  function celesta(m, t, vol = .05, pan = 0){
    const out = salida(pan, .5, 1);
    [[1, 1, 1.6], [4, .25, .5], [7.1, .08, .25]].forEach(([k, a, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = hz(m) * k;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * a, t + .003); g.gain.exponentialRampToValueAtTime(.00006, t + d * 1.8);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 3.5);
    });
  }
  function bajo(m, t, dur){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .25); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
    o.connect(g); g.connect(mezcla); o.start(t); o.stop(t + dur + .1);
  }

  // un pajarito cantando a lo lejos
  function pajaro(t){
    const out = salida((Math.random() - .5) * 1.4, .3, .6);
    const notas = 2 + (Math.random() * 4 | 0), base = 2600 + Math.random() * 1600;
    for (let i = 0; i < notas; i++){
      const o = ctx.createOscillator(), g = ctx.createGain(), ti = t + i * (.09 + Math.random() * .05);
      o.type = 'sine';
      o.frequency.setValueAtTime(base * (1 + Math.random() * .15), ti);
      o.frequency.exponentialRampToValueAtTime(base * (1.35 + Math.random() * .3), ti + .045);
      o.frequency.exponentialRampToValueAtTime(base * .9, ti + .08);
      g.gain.setValueAtTime(0, ti); g.gain.linearRampToValueAtTime(.016, ti + .01); g.gain.exponentialRampToValueAtTime(.0001, ti + .09);
      o.connect(g); g.connect(out); o.start(ti); o.stop(ti + .12);
    }
  }

  // ── La huella: orquesta suave. Piano, cuerdas, flauta, coro y un tambor lejano ──
  function flauta(m, t, d, vol = .045){
    const out = salida(.1, .7, .85);
    const g = ctx.createGain(); g.connect(out);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .14);
    g.gain.setValueAtTime(vol, t + Math.max(.15, d * .7)); g.gain.exponentialRampToValueAtTime(.0004, t + d + .7);
    const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 5.1; vg.gain.value = hz(m) * .005; vib.connect(vg);
    [['sine', 1], ['triangle', .3]].forEach(([tipo, a]) => {
      const o = ctx.createOscillator(), ga = ctx.createGain(); o.type = tipo; o.frequency.value = hz(m); ga.gain.value = a;
      vg.connect(o.frequency); o.connect(ga); ga.connect(g); o.start(t); o.stop(t + d + .8);
    });
    vib.start(t); vib.stop(t + d + .8);
  }
  function trompa(m, t, d, vol = .026){
    const out = salida(-.12, .6, .9);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 620; f.Q.value = .7; f.connect(out);
    const g = ctx.createGain(); g.connect(f);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .4);
    g.gain.setValueAtTime(vol, t + Math.max(.45, d * .75)); g.gain.linearRampToValueAtTime(0, t + d + .6);
    [-5, 5].forEach(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = dt; o.connect(g); o.start(t); o.stop(t + d + .7); });
  }
  function coro(notas, t, d, vol = .016){
    const out = salida(0, .35, 1.2);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + d * .45); g.gain.linearRampToValueAtTime(0, t + d + 1.2);
    [[720, 6, 1], [1150, 7, .55], [2500, 9, .18]].forEach(([fr, q, a]) => {       // vocal "aaah"
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fr; f.Q.value = q;
      const ga = ctx.createGain(); ga.gain.value = a; g.connect(f); f.connect(ga); ga.connect(out);
    });
    notas.forEach(m => [-9, 9].forEach(dt => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = dt;
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 4.4 + Math.random() * .6; lg.gain.value = 5;
      lfo.connect(lg); lg.connect(o.detune); o.connect(g);
      o.start(t); o.stop(t + d + 1.3); lfo.start(t); lfo.stop(t + d + 1.3);
    }));
  }
  function tambor(t, vol = .13){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(84, t); o.frequency.exponentialRampToValueAtTime(46, t + .9);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .025); g.gain.exponentialRampToValueAtTime(.0006, t + 2.6);
    o.connect(g); g.connect(mezcla); g.connect(rev); o.start(t); o.stop(t + 2.7);
  }
  // cuatro momentos que se repiten: calma, canto, crecida épica, cielo
  function programarHuella(){
    while (proximo < ctx.currentTime + 1.5){
      const t = proximo, ac = ACORDES[compas % 8], fase = Math.floor(compas / 8) % 4, dur = BEAT * 4;
      cuerdas(ac.t.map(m => m - 12), t, dur * 1.05, fase === 2 ? .055 : .034);
      bajo(ac.r - 12, t, dur * 1.1);
      [ac.r, ac.r + 7, ac.t[1], ac.t[2]].forEach((m, i) => piano(m, t + i * BEAT + (i % 2) * .015, i === 0 ? .46 : .27, -.3 + i * .15, 1.25));
      if (fase >= 1){
        let b = 0;
        for (const [m, p] of MELODIA[compas % 8]){
          flauta(m + (fase === 3 ? 12 : 0), t + b * BEAT + .02, p * BEAT, fase === 2 ? .05 : .04);
          if (fase === 2) trompa(m - 12, t + b * BEAT + .02, p * BEAT);
          b += p;
        }
      }
      if (fase === 2){ coro(ac.t, t, dur); if (compas % 4 === 0) tambor(t); }
      if (fase === 3){ coro(ac.t.map(m => m + 12), t, dur, .008); celesta(CONTRA[compas % 8], t + BEAT * 2, .03, .35); }
      if (Math.random() < .6) pajaro(t + Math.random() * dur);
      if (Math.random() < .3) pajaro(t + Math.random() * dur);
      compas++; proximo += dur;
    }
  }
  // el río: un murmullo de agua que sube cuando la cámara pasa sobre él
  let rioG = null;
  let marG = null;
  function sonidoMar(){
    const len = ctx.sampleRate * 4, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = b; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    const ola = ctx.createGain(); ola.gain.value = .5;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .09; lg.gain.value = .45; lfo.connect(lg); lg.connect(ola.gain);
    marG = ctx.createGain(); marG.gain.value = 0;
    src.connect(f); f.connect(ola); ola.connect(marG); marG.connect(mezcla); src.start(); lfo.start();
  }
  function sonidoRio(){
    const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let u = 0;
    for (let i = 0; i < len; i++){ u = u * .97 + (Math.random() * 2 - 1) * .03; d[i] = u * 6 + (Math.random() * 2 - 1) * .12; }
    const src = ctx.createBufferSource(); src.buffer = b; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = .4;
    rioG = ctx.createGain(); rioG.gain.value = 0;
    src.connect(f); f.connect(rioG); rioG.connect(mezcla); src.start();
  }

  let compas = 0, proximo = 0;
  function programar(){
    if (!ctx) return;
    if (HUELLA) return programarHuella();
    while (proximo < ctx.currentTime + 1.5){
      const t = proximo, ac = ACORDES[compas % 8], vuelta = Math.floor(compas / 8);
      const dur = BEAT * 4;
      // mano izquierda: arpegio en corcheas
      const arp = [ac.r, ac.r + 7, ac.r + 12, ac.t[1], ac.t[2], ac.t[1], ac.r + 12, ac.r + 7];
      arp.forEach((m, i) => piano(m, t + i * BEAT / 2 + (i % 2) * .012, i === 0 ? .55 : .32, -.25 + i * .04, .8));
      bajo(ac.r - 12, t, dur * 1.1);
      if (vuelta >= 1) cuerdas(ac.t.map(m => m - 12), t, dur, vuelta >= 2 ? .045 : .03);
      // la melodía entra en la segunda vuelta; en la cuarta sube una octava; la quinta respira
      if (vuelta >= 1 && vuelta % 4 !== 0){
        let b = 0;
        for (const [m, p] of MELODIA[compas % 8]){
          piano(m + (vuelta % 4 === 3 ? 12 : 0), t + b * BEAT + .02, .62, .12, 1.3);
          b += p;
        }
      }
      if (vuelta >= 2) celesta(CONTRA[compas % 8], t + BEAT * 2, .035, .35);
      if (HUELLA){ if (Math.random() < .6) pajaro(t + Math.random() * dur); if (Math.random() < .3) pajaro(t + Math.random() * dur); }
      compas++; proximo += dur;
    }
  }

  return {
    iniciar(){
      if (empezado) return; empezado = true;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      master.connect(comp); comp.connect(ctx.destination);
      mezcla = ctx.createGain(); mezcla.connect(master);
      rev = reverb(); const gr = ctx.createGain(); gr.gain.value = .6; rev.connect(gr); gr.connect(master);
      master.gain.linearRampToValueAtTime(1, ctx.currentTime + 3);
      proximo = ctx.currentTime + .3;
      setInterval(programar, 200); programar();
      if (HUELLA){ sonidoRio(); sonidoMar(); }
      // Si guardas un audio con tu voz llamado voz.mp3 junto a este archivo, suena solo.
      voz = new Audio('voz.mp3'); voz.preload = 'auto';
      voz.addEventListener('canplaythrough', () => {
        setTimeout(() => { if (activo){ master.gain.linearRampToValueAtTime(.35, ctx.currentTime + 1.5); voz.play().catch(() => {}); } }, 5500);
      }, { once: true });
      voz.addEventListener('ended', () => master.gain.linearRampToValueAtTime(1, ctx.currentTime + 3));
      voz.addEventListener('error', () => { voz = null; });
    },
    rio(v){ if (rioG) rioG.gain.setTargetAtTime(v * .05, ctx.currentTime, 1.2); },
    mar(v){ if (marG) marG.gain.setTargetAtTime(v * .09, ctx.currentTime, 1.5); },
    campanita(suave){
      if (!ctx || !activo) return;
      const ac = ACORDES[(compas + 7) % 8], t = ctx.currentTime;
      [...ac.t, ac.t[0] + 12].forEach((m, i) => celesta(m + 12, t + i * .075, suave ? .022 : .05, (i - 1.5) * .3));
    },
    alternar(){
      activo = !activo;
      if (ctx){ activo ? ctx.resume() : ctx.suspend(); }
      if (voz){ activo ? (voz.currentTime > 0 && !voz.ended && voz.play().catch(() => {})) : voz.pause(); }
      return activo;
    }
  };
})();

/* ════════════════════════════════════════════════════════════════════
   El mensaje en pantalla
   ════════════════════════════════════════════════════════════════════ */
const caja = document.getElementById('mensaje');
let secuencia = 0;
let hablando = false;
async function contar(lista = MENSAJE, pausa = 3.5, cola = 6){
  const mia = ++secuencia; hablando = true;
  document.getElementById('hud').classList.add('ver');
  const espera = s => new Promise(r => setTimeout(r, s * 1000));
  await espera(pausa);
  for (const [html, dur] of lista){
    if (mia !== secuencia) return;
    const el = document.createElement('p');
    el.className = 'linea'; el.innerHTML = html;
    caja.replaceChildren(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('ver')));
    await espera(dur);
    if (mia !== secuencia) return;
    if (html !== lista[lista.length - 1][0]){ el.classList.add('ir'); await espera(1.3); }
  }
  document.getElementById('hud').classList.add('ver');
  await espera(cola);
  if (mia === secuencia){ const el = caja.firstChild; if (el){ el.classList.add('ir'); } await espera(1.4); if (mia === secuencia) hablando = false; }
}

/* ════════════════════════════════════════════════════════════════════
   Arranque
   ════════════════════════════════════════════════════════════════════ */
let listo = false, t0 = 0;
const reloj = new THREE.Clock();
const numero = document.getElementById('numero');

document.getElementById('irOtra').addEventListener('click', () => window.irA(!HUELLA));
document.getElementById('abrir').addEventListener('click', () => {
  sonar.iniciar();
  document.getElementById('portada').classList.add('fuera');
  listo = true; t0 = reloj.getElapsedTime() - (+new URLSearchParams(location.search).get('t') || 0);
  contar();
});
document.getElementById('btnRepetir').addEventListener('click', e => { e.stopPropagation(); t0 = reloj.getElapsedTime(); zonaDicha = -1; contar(); });
document.getElementById('btnSonido').addEventListener('click', e => {
  e.stopPropagation();
  const on = sonar.alternar();
  document.getElementById('icoSonido').innerHTML = on
    ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'
    : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>';
});
['btnRepetir', 'btnSonido'].forEach(id => document.getElementById(id).addEventListener('pointerup', e => e.stopPropagation()));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = esMovil && innerWidth < innerHeight ? 68 : 55;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  polen.uniforms.uPx.value = innerHeight * pr; window.__puntos.uniforms.uPx.value = innerHeight * pr;
});

// calidad adaptable: si va lento, baja resolución
let fpsAcum = 0, fpsN = 0, fpsChequeo = 0, ultimoConteo = -1, nivel = 0;
function ajustarCalidad(dt){
  fpsAcum += dt; fpsN++; fpsChequeo += dt;
  if (fpsChequeo > 2 && listo){
    const fps = fpsN / fpsAcum; fpsAcum = 0; fpsN = 0; fpsChequeo = 0;
    if (fps >= 40 || nivel >= 6) return;
    nivel++;
    if (pr > .8 && fps < 40){
      pr = Math.max(.8, pr - .15); renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
      polen.uniforms.uPx.value = innerHeight * pr; window.__puntos.uniforms.uPx.value = innerHeight * pr;
    }
    // menos hojas de zacate y menos flores, sin tocar las que ella sembró
    for (const t of zacate.trozos) t.geometry.instanceCount = Math.max(Math.floor(t.geometry.instanceCount * .72), Math.floor(t.userData.n0 * .3));
    for (const e of especies) for (const m of e.parcelas) m.count = Math.max(Math.floor(m.count * .8), Math.floor(m.userData.n0 * .4));
    if (fps < 24) bloom.enabled = false;
  }
}

const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3();
let vivo = true;
window.detenerMundo = () => { vivo = false; try { renderer.dispose(); renderer.forceContextLoss(); } catch (e) {} };
function animar(){
  if (!vivo) return;
  const dt = Math.min(reloj.getDelta(), .05);
  const T = reloj.getElapsedTime();
  const t = listo ? T - t0 : 0;
  U.uTime.value = listo ? t : -10;
  U.uViento.value = reduceMov ? .3 : 1;
  cielo.material.uniforms.uT.value = T;
  moverCamara(t, dt);
  polen.uniforms.uCam.value.copy(camera.position);

  // pétalos al viento alrededor de la cámara
  const { m, datos } = petalosVuelo;
  for (let i = 0; i < datos.length; i++){
    const d = datos[i];
    if (HUELLA) moverHoja(d, dt, T);
    else {
    if (d.vy){ d.x += d.vx * dt; d.z += d.vz * dt; d.y += d.vy * dt; d.vy -= 2.6 * dt; d.vx *= .985; d.vz *= .985; if (d.vy < -d.v){ d.vy = 0; } }
    else { d.y -= d.v * dt; d.x += (.9 + Math.sin(T * .7 + d.f) * .6) * dt; d.z += Math.cos(T * .5 + d.f) * .3 * dt; }
    d.rx += dt * 2.1 * d.v; d.rz += dt * 1.3;
    let lx = d.x - camera.position.x, lz = d.z - camera.position.z;
    if (!d.vy && (d.y < altura(d.x, d.z) || Math.abs(lx) > 25 || Math.abs(lz) > 25)){
      d.x = camera.position.x + rango(-25, 15); d.z = camera.position.z + rango(-25, 25); d.y = camera.position.y + rango(2, 9);
    }
    }
    dummy.position.set(d.x, d.y, d.z);
    dummy.rotation.set(d.rx, d.f, d.rz);
    dummy.scale.setScalar(listo ? d.s : 0);
    dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix);
  }
  m.instanceMatrix.needsUpdate = true;

  // mariposas
  for (const b of mariposas){
    if (b.libre && b.nace < 0) continue;
    const k = b.libre ? Math.min(1, (T - b.nace) / 3) : 1;   // las recién soltadas suben en espiral
    const a = T * b.v + b.f;
    const x = b.c.x + Math.cos(a) * b.r * k, z = b.c.z + Math.sin(a * 1.3) * b.r * k;
    const y = altura(x, z) + (b.libre ? .15 + (b.h - .15) * k : b.h) + Math.sin(T * 1.7 + b.f) * .35;
    b.cuerpo.lookAt(x + (x - b.cuerpo.position.x) * 10, y, z + (z - b.cuerpo.position.z) * 10);
    b.cuerpo.position.set(x, y, z);
    const aleteo = Math.sin(T * b.ale + b.f) * 1.1 + .15;
    b.iz.rotation.z = aleteo; b.de.rotation.z = -aleteo;
    if (HUELLA) b.cuerpo.visible = (!b.libre || b.nace >= 0) && camera.position.distanceToSquared(b.cuerpo.position) < 2500;
  }

  if (HUELLA) actualizarHuella(T, dt);

  // chispas
  for (let i = chispas.length - 1; i >= 0; i--){
    const c = chispas[i]; c.t += dt;
    c.m.scale.setScalar(.2 + c.t * 7); c.m.material.opacity = Math.max(0, 1 - c.t / 1.1);
    if (c.t > 1.1){ scene.remove(c.m); c.m.material.dispose(); chispas.splice(i, 1); }
  }

  if (listo){ const n = floresReales(); if (n !== ultimoConteo){ ultimoConteo = n; numero.textContent = n.toLocaleString('es-CR'); } }

  ajustarCalidad(dt);
  composer.render(dt);
  requestAnimationFrame(animar);
}

// primer cuadro para compilar shaders antes de mostrar el botón
renderer.compile(scene, camera);
requestAnimationFrame(animar);
setTimeout(() => {
  document.getElementById('cargando').hidden = true;
  document.getElementById('abrir').hidden = false;
  document.getElementById('notaSonido').hidden = false;
  document.getElementById('irOtra').hidden = false;
}, 350);
</script>
