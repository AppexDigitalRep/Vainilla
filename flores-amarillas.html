<style>
  :root{
    --oro:#FFC21A; --oro-luz:#FFE38A; --crema:#FFF6E0; --noche:#140b06;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--noche);overflow:hidden;color:var(--crema);

  /* ── Portada ─────────────────────────────── */
  #portada{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;
    background:radial-gradient(120% 90% at 50% 110%, #3a1d08 0%, #1d0f07 45%, #0c0604 100%);
    transition:opacity 2.4s ease, visibility 2.4s;padding:24px}
  #portada.fuera{opacity:0;visibility:hidden}
  .semilla{width:92px;height:92px;margin:0 auto 28px;position:relative;animation:latido 3.2s ease-in-out infinite}
  .semilla i{position:absolute;left:50%;top:50%;width:18px;height:40px;margin:-40px 0 0 -9px;border-radius:50%;
    background:linear-gradient(#FFE38A,#FFB300);transform-origin:50% 100%;opacity:.95}

  #portada .fecha{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.42em;text-transform:uppercase;

  #portada .nota{margin-top:18px;font-family:'Jost',sans-serif;font-weight:300;font-size:12px;opacity:.55;letter-spacing:.06em}
  #cargando{font-family:'Jost',sans-serif;font-weight:300;font-size:12px;letter-spacing:.2em;opacity:.6;margin-top:44px}

  /* ── Mensaje ─────────────────────────────── */
  #mensaje{position:fixed;left:0;right:0;top:0;bottom:0;z-index:10;display:grid;place-items:center;pointer-events:none;padding:0 22px}
  .linea{max-width:920px;text-align:center;padding:1.1em 1.4em;border-radius:50%;
    background:radial-gradient(closest-side, rgba(40,14,0,.55), rgba(40,14,0,.25) 60%, transparent);font-size:clamp(25px,4.4vw,50px);line-height:1.22;font-weight:400;
    color:var(--crema);text-shadow:0 2px 24px rgba(40,15,0,.75),0 0 2px rgba(40,15,0,.6);opacity:0;

  .linea.ver{opacity:1;transform:none;filter:blur(0)}
  .linea.ir{opacity:0;transform:translateY(-14px);filter:blur(8px);transition-duration:1.4s}
  .linea small{display:block;font-family:'Jost',sans-serif;font-weight:300;font-size:.32em;letter-spacing:.4em;text-transform:uppercase;
    color:#ffe6a6;margin-bottom:.9em}
  .linea .firma{font-family:'Great Vibes',cursive;color:var(--oro);font-size:1.5em;display:block;margin-top:.25em;
    text-shadow:0 0 30px #ffb30088, 0 2px 20px rgba(40,15,0,.8)}
  .linea i{color:var(--oro-luz)}
  .linea.grande{font-size:clamp(32px,6vw,72px)}

  /* ── Interfaz final ──────────────────────── */
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:space-between;align-items:flex-end;

  #contador{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff3cf;text-shadow:0 1px 10px #000a}

  #velo{position:fixed;inset:0;z-index:9;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(30,10,0,.55) 100%)}
  /* ── Segunda pradera: la huella ───────────── */
  .acciones{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:44px}
  .acciones #abrir{margin-top:0}
  #irOtra{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:#ffe6a6;
    background:transparent;border:1px solid #ffe6a64d;border-radius:999px;padding:12px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
    transition:background .25s ease,border-color .25s ease}
  .acciones{position:relative}
  #cargando{position:absolute;left:0;right:0;top:18px;margin:0 !important}
  #abrir,#irOtra,#notaSonido,#cargando{transition:opacity .8s ease, visibility .8s, transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease}
  #abrir[hidden]{display:inline-block;visibility:hidden;opacity:0}
  #irOtra[hidden]{display:inline-flex;visibility:hidden;opacity:0}
  #notaSonido[hidden]{display:block;visibility:hidden;opacity:0}
  #cargando[hidden]{display:block;visibility:hidden;opacity:0}
  #irOtra:hover{background:#ffe6a614;border-color:#ffe6a699}
  #irOtra svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .huella{--oro:#ffb8d2;--oro-luz:#ffd9e8;--crema:#fff8fb;--noche:#0d0c1c}
  html.quieto *, html.quieto *::before{transition:none !important}
  html.huella:not(.textos) #portada > div{visibility:hidden}
  @view-transition{navigation:auto}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
  #portada::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
    background:radial-gradient(120% 90% at 50% 110%, #4a2f5e 0%, #1f1a3a 45%, #0b0a18 100%)}
  .huella #portada::before{opacity:1}
  #portada > div > *{transition:opacity .55s ease, filter .55s ease}
  body.cambiando #portada > div > *{opacity:0 !important;filter:blur(8px)}
  .huella .semilla i:nth-of-type(1){background:linear-gradient(#ffd1dc,#ff5c8a)}
  .huella .semilla i:nth-of-type(2){background:linear-gradient(#e9dcff,#9b6bff)}
  .huella .semilla i:nth-of-type(3){background:linear-gradient(#d6ecff,#4f8bff)}
  .huella .semilla i:nth-of-type(4){background:linear-gradient(#ffd0c4,#ff3b3b)}
  .huella .semilla i:nth-of-type(5){background:linear-gradient(#ffffff,#e8e2f2)}
  .huella .semilla i:nth-of-type(6){background:linear-gradient(#ffe0b8,#ff8a1f)}
  .huella .semilla i:nth-of-type(7){background:linear-gradient(#f3d4ff,#c04dff)}
  .huella .semilla i:nth-of-type(8){background:linear-gradient(#fff3b0,#ffc21a)}
  .huella .semilla b{background:radial-gradient(#ffe38a,#d99a00);box-shadow:0 0 30px #ffb8d266}
  .huella #portada .fecha{color:#e6d8ff}
  .huella #portada h1{font-size:clamp(28px,5.6vw,52px)}
  .huella #portada h1 em{text-shadow:0 0 28px #ff8fb855}
  .huella #abrir{color:#2a1430;background:linear-gradient(180deg,#ffe3ee,#f4a6c7);box-shadow:0 10px 40px -8px #ff8fb8aa, inset 0 1px 0 #fff8}
  .huella #abrir:hover{box-shadow:0 16px 50px -8px #ff8fb8cc, inset 0 1px 0 #fff8}
  .huella #irOtra{color:#e6d8ff;border-color:#e6d8ff4d}
  .huella .linea{background:radial-gradient(closest-side, rgba(28,18,52,.5), rgba(28,18,52,.22) 60%, transparent);
    text-shadow:0 2px 24px rgba(20,10,40,.75),0 0 2px rgba(20,10,40,.6)}
  .huella .linea small{color:#efe4ff}
  .huella .linea .firma{text-shadow:0 0 30px #ff8fb888, 0 2px 20px rgba(20,10,40,.8)}
  .huella #contador, .huella #pista{color:#fff5fb}

  .huella .boton{border-color:#ffd9e855;background:#2a1a3a55;color:#ffd9e8}
  .huella .boton:hover{background:#2a1a3aaa}

<section id="portada">
  <div>
    <div class="semilla" aria-hidden="true"><i style="transform:rotate(0deg)"></i><i style="transform:rotate(45deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i><b></b></div>
    <p class="fecha">21 · septiembre · 2026</p>
    <h1>Hoy es el día de las flores amarillas<em>Vainilla</em></h1>
    <div class="acciones">
      <p id="cargando">sembrando la pradera…</p>
      <button id="abrir" hidden>Ábrelo, girasol</button>
      <button id="irOtra" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v12"/><path d="M12 9C10.5 4.5 5 3 3.6 5.6 2.4 8 5 11.4 12 11.2"/><path d="M12 9c1.5-4.5 7-6 8.4-3.4 1.2 2.4-1.4 5.8-8.4 5.6"/><path d="M12 12.4c-2.6.2-6 2.2-5 4.8.9 2.2 4 .6 5-2.2"/><path d="M12 12.4c2.6.2 6 2.2 5 4.8-.9 2.2-4 .6-5-2.2"/><path d="M12 6.5 10.6 4M12 6.5l1.4-2.5"/></svg><span>Una huella en mi corazón</span></button>
    </div>
    <p class="nota" id="notaSonido" hidden>súbele el volumen ✨</p>
  </div>
</section>
<script>
  // Los dos mundos comparten la página: ?huella abre el segundo. El cambio se anima suave.
  (function(){
    const T = {
      amarillo: { titulo: 'Flores amarillas para Vainilla', fecha: '21 · septiembre · 2026', h1: 'Hoy es el día de las flores amarillas<em>Vainilla</em>',
        abrir: 'Ábrelo, girasol', otra: 'Una huella en mi corazón', cargando: 'sembrando la pradera…', nota: 'súbele el volumen ✨',
        contador: 'flores en esta pradera', pista: 'tocá y nacen flores<br>deslizá para mirar' },
      huella: { titulo: 'La huella de Vainilla', fecha: '22 · septiembre · 2026', h1: 'Somos lo que dejamos en el corazón de las personas<em>Vainilla</em>',
        abrir: 'Entrá a mi corazón', otra: 'Volver a las flores amarillas', cargando: 'sembrando tu huella…', nota: 'con audífonos se siente más bonito 🦋',
        contador: 'vida en mi corazón', pista: 'tocá y nace vida<br>deslizá y dejá tu huella' },
    };
    const $ = (q) => document.querySelector(q);
    function poner(huella){
      const t = huella ? T.huella : T.amarillo;
      document.body.classList.toggle('huella', huella); document.documentElement.classList.toggle('huella', huella);
      document.title = t.titulo;
      $('#portada .fecha').textContent = t.fecha;
      $('#portada h1').innerHTML = t.h1;
      $('#abrir').textContent = t.abrir;
      $('#irOtra span').textContent = t.otra;
      $('#cargando').textContent = t.cargando;
      $('#notaSonido').textContent = t.nota;
      const c = $('#contador'), pi = $('#pista');
      if (c) c.firstChild.textContent = t.contador;
      if (pi) pi.innerHTML = t.pista;
      document.documentElement.classList.add('textos');
    }
    const esHuella = new URLSearchParams(location.search).has('huella');
    if (esHuella) poner(true); else document.documentElement.classList.add('textos');
    addEventListener('DOMContentLoaded', () => {
      if (esHuella) poner(true);
      requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('quieto')));
    });
    // se funde: los textos se desvanecen, cambian de mundo y reaparecen; luego entra la otra pradera
    // la página de arriba es el anfitrión: abre el otro mundo en una capa invisible y la muestra
    // solo cuando ya se ve idéntica al final de la animación. Sin recargas, sin pantallas en medio.
    if (window.top === window){
      window.abrirMundo = function(huella){
        const f = document.createElement('iframe');
        f.src = location.pathname + (huella ? '?huella&capa' : '?capa');
        f.allow = 'autoplay; fullscreen';
        f.className = 'mundo-cargando';
        f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;z-index:100;background:transparent';
        const listo = (e) => {
          if (e.source !== f.contentWindow || !e.data || e.data.tipo !== 'listo') return;
          removeEventListener('message', listo);
          f.style.opacity = '1';
          document.querySelectorAll('iframe.mundo').forEach(v => v.remove());
          f.className = 'mundo';
          history.replaceState(null, '', location.pathname + (huella ? '?huella' : ''));
          document.title = huella ? T.huella.titulo : T.amarillo.titulo;
          try { f.contentWindow.focus(); } catch (err) {}
        };
        addEventListener('message', listo);
        document.body.appendChild(f);
      };
    }
    // si esta página es la capa, avisa cuando su portada ya está dibujada
    if (/[?&]capa/.test(location.search)){
      addEventListener('DOMContentLoaded', () => (document.fonts ? document.fonts.ready : Promise.resolve())
        .then(() => requestAnimationFrame(() => requestAnimationFrame(() => parent.postMessage({ tipo: 'listo' }, '*')))));
    }
    window.irA = function(huella){
      document.body.classList.add('cambiando');
      setTimeout(() => {
        poner(huella);
        $('#abrir').hidden = true; $('#irOtra').hidden = true; $('#notaSonido').hidden = true; $('#cargando').hidden = false;
        document.body.classList.remove('cambiando');
      }, 650);
      setTimeout(() => {
        try { if (window.detenerMundo) window.detenerMundo(); } catch (e) {}
        let host = null; try { host = window.top.abrirMundo ? window.top : null; } catch (e) {}
        if (host) host.abrirMundo(huella); else location.href = location.pathname + (huella ? '?huella' : '');
      }, 1500);
    };
  })();
</script>

  [['<small>la vida</small>Todo lo que despertaste en mí', 6], ['las ganas de volar más lejos', 5]],

   ['<span class="grande">Gracias por tu huella, hermosa</span><span class="firma">— tu Vikingo</span>', 9]],

];

/* ════════════════════════════════════════════════════════════════════
   Calidad según el aparato
   ════════════════════════════════════════════════════════════════════ */
const esMovil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1100);
const Q = esMovil ? (HUELLA ? .36 : .45) : 1;           // densidad
const reduceMov = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── azar reproducible y ruido ─────────────────────────────────────── */
let semilla = 2109;
const rnd = () => { semilla = (semilla * 16807) % 2147483647; return (semilla - 1) / 2147483646; };
const rango = (a, b) => a + (b - a) * rnd();
function hash(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function ruido(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => ruido(x, y) * .55 + ruido(x * 2.1 + 5.2, y * 2.1 + 1.3) * .3 + ruido(x * 4.3 + 9, y * 4.3 + 4) * .15;

/* Relieve suave de la pradera */
function altura(x, z){ return HUELLA ? alturaH(x, z) : alturaAmarilla(x, z); }
function alturaAmarilla(x, z){
  const r = Math.hypot(x, z);
  let h = (fbm(x * .018, z * .018) - .5) * 7 + Math.sin(x * .05) * .8 + Math.cos(z * .043) * .9;
  h += Math.max(0, r - 90) * .03;               // colinas que suben al horizonte
  return h;
}

/* ════════════════════════════════════════════════════════════════════
   Escena
   ════════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('escena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pr = Math.min(devicePixelRatio, HUELLA && esMovil ? 1 : 1.25);
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = HUELLA ? 0.95 : 0.88;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const HORIZONTE = new THREE.Color(HUELLA ? '#cfe0f2' : '#f0874a');
scene.fog = new THREE.FogExp2(HORIZONTE, HUELLA ? 0.003 : 0.0072);

const camera = new THREE.PerspectiveCamera(esMovil && innerWidth < innerHeight ? 68 : 55, innerWidth / innerHeight, 0.05, 900);

const SOL_DIR = (HUELLA ? new THREE.Vector3(0.3, 0.42, 1) : new THREE.Vector3(-0.35, 0.12, -1)).normalize();   // mañana clara / sol de atardecer

/* Cielo de la huella: mañana clara, nubes de algodón y un arcoíris suave */
const CIELO_HUELLA = `
  varying vec3 vDir; uniform vec3 uSol; uniform float uT; uniform float uTarde;
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
  vec3 arcoiris(float x){ return clamp(abs(mod(x * 6. + vec3(0., 4., 2.), 6.) - 3.) - 1., 0., 1.); }
  void main(){
    vec3 dir = normalize(vDir); float y = dir.y;
    vec3 sol = normalize(uSol);
    float d = max(dot(dir, sol), 0.);
    vec3 horiz = mix(vec3(.98, .88, .84), vec3(1., .4, .12), uTarde);
    vec3 lila = mix(vec3(.76, .85, .99), vec3(.98, .48, .36), uTarde);
    vec3 celeste = mix(vec3(.46, .7, .98), vec3(.72, .42, .55), uTarde);
    vec3 cenit = mix(vec3(.2, .44, .9), vec3(.2, .17, .42), uTarde);
    vec3 c = mix(horiz, lila, smoothstep(0., .08, y));
    c = mix(c, celeste, smoothstep(.06, .32, y));
    c = mix(c, cenit, smoothstep(.3, .95, y));
    c = mix(c, mix(vec3(.89, .9, .93), vec3(.95, .6, .45), uTarde), smoothstep(0., -.15, y));
    c = mix(c, vec3(1., .52, .16), pow(d, 4.) * .7 * uTarde);                      // el cielo arde alrededor del sol
    c += mix(vec3(1., .93, .8), vec3(1., .45, .08), uTarde) * pow(d, mix(6., 16., uTarde)) * mix(.28, .6, uTarde);
    c += mix(vec3(1., .96, .88), vec3(1., .7, .32), uTarde) * pow(d, 90.) * mix(.7, 1., uTarde);
    c += mix(vec3(1.), vec3(1., .86, .6), uTarde) * smoothstep(mix(.9991, .9983, uTarde), mix(.9996, .9991, uTarde), d) * 5.;
    float ang = acos(clamp(dot(dir, -sol), -1., 1.));
    float banda = (ang - .70) / .05;
    if (banda > 0. && banda < 1. && y > 0.){
      c = mix(c, arcoiris((1. - banda) * .78), sin(banda * 3.14159) * smoothstep(0., .14, y) * .17 * (1. - uTarde));
    }
    vec2 q = dir.xz / (max(y, .02) + .14) * 1.3 + vec2(uT * .008, uT * .003);
    float n = vn(q) * .5 + vn(q * 2.1 + 3.) * .25 + vn(q * 4.3 + 7.) * .15 + vn(q * 8.9) * .1;
    float nube = smoothstep(.56, .76, n) * smoothstep(.03, .2, y);
    vec3 cn = mix(vec3(.86, .89, .97), vec3(1.), smoothstep(.58, .85, n));
    cn += vec3(1., .92, .82) * pow(d, 3.) * .25;
    cn = mix(cn, mix(vec3(.85, .42, .52), vec3(1., .66, .3), pow(d, 1.5)), uTarde * .85);   // nubes encendidas
    c = mix(c, cn, nube * .92);
    gl_FragColor = vec4(c, 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

/* ════════════════════════════════════════════════════════════════════
   LA HUELLA — terreno y ruta del viaje: bosque → río → flores → sabana → cima
   ════════════════════════════════════════════════════════════════════ */
const ZONA = { BOSQUE: 0, RIO: 1, FLORES: 2, SABANA: 3, CIMA: 4, MAR: 5 };
const U_TARDE = { value: 0 };                     // 0 = mañana clara, 1 = atardecer
const TARDE_ZONA = [0, .2, .85, .9, 1, 1];          // el sol baja al llegar al mar y ya no vuelve a subir
const MONTE = { x: 58, z: 92, r: 42, h: 78 };
function costaDe(x, z){ return -x - 205 + (fbm(z * .008 + 3, 1.7) - .5) * 70; }
function alturaBaseH(x, z){
  let h = (fbm(x * .012 + 3, z * .012) - .5) * 9 + Math.sin(x * .025) * 1.2 + Math.cos(z * .021) * 1.4;
  const dm = Math.hypot(x - MONTE.x, z - MONTE.z);
  h += MONTE.h * Math.exp(-((dm / MONTE.r) ** 2)) * (.8 + .4 * fbm(x * .04 + 7, z * .04 - 2));
  const costa = costaDe(x, z);                                     // distancia pasada la línea de costa (al oeste)
  h += Math.max(0, Math.hypot(x, z) - 175) * .12 * (1 - THREE.MathUtils.smoothstep(-x, 90, 170));   // colinas al borde, menos hacia el mar
  const arena = THREE.MathUtils.smoothstep(costa, -85, -45);         // la playa: ancha y casi plana
  h = h * (1 - arena) + (.45 + (fbm(x * .05, z * .05) - .5) * .35 + Math.max(0, -costa) * .004) * arena;
  const agua = THREE.MathUtils.smoothstep(costa, -8, 38);
  return h * (1 - agua) - 5 * agua;
}
// ruta: [x, z, altura sobre el suelo, zona]
const PUNTOS_H = [
  // bosque nuboso: sobrevuelo del dosel y picada entre los gigantes
  [48, 170, 56, 0], [18, 168, 56, 0], [-10, 150, 50, 0], [-26, 128, 26, 0], [-34, 104, 4.2, 0], [-45, 80, 3.8, 0],
  // el río, que corre hacia el mar
  [-58, 55, 3, 1], [-80, 35, 2.8, 1], [-110, 20, 2.8, 1], [-145, 8, 2.9, 1], [-175, -2, 3, 1],
  // el mar: la desembocadura, rasante sobre las olas y de vuelta por la playa
  [null, -10, 3.2, 5, 16], [null, -38, 3.2, 5, 5], [null, -72, 3.4, 5, -5], [null, -104, 3.6, 5, 4], [null, -122, 4, 5, 18],   // x: se busca la orilla
  // las flores
  [-110, -122, 3.2, 2], [-70, -116, 3, 2], [-30, -108, 3, 2],
  // la sabana
  [20, -95, 3.4, 3], [70, -70, 3.6, 3], [100, -30, 3.6, 3],
  // la cima
  [100, 10, 8, 4], [90, 40, 12, 4], [78, 62, 16, 4], [60, 92, 14, 4], [30, 128, 46, 4],
];
// en el mar, cada punto se acomoda a la orilla real: unos metros sobre la arena o sobre la rompiente
for (const pt of PUNTOS_H) if (pt[0] === null){ let x = -340; while (x < -100 && alturaBaseH(x, pt[1]) <= -1.1) x += 1; pt[0] = x + pt[4]; }
const RUTA_HUELLA = HUELLA ? new THREE.CatmullRomCurve3(PUNTOS_H.map(([x, z, c]) => new THREE.Vector3(x, Math.max(alturaBaseH(x, z), -1.1) + c, z)), true, 'centripetal') : null;

// muestras a lo largo de la ruta: posición, normal, zona y cuánto río hay ahí
const MUESTRAS_H = [];
if (HUELLA){
  const N = 900, pts = RUTA_HUELLA.getSpacedPoints(N);
  for (let i = 0; i < N; i++){
    const t = RUTA_HUELLA.getUtoTmapping(i / N);
    const seg = Math.floor(t * PUNTOS_H.length) % PUNTOS_H.length;
    const a = pts[i], b = pts[(i + 1) % N];
    const tx = b.x - a.x, tz = b.z - a.z, l = Math.hypot(tx, tz) || 1;
    MUESTRAS_H.push({ x: a.x, z: a.z, nx: -tz / l, nz: tx / l, u: i / N, zona: PUNTOS_H[seg][3], rio: 0, alto: a.y - alturaBaseH(a.x, a.z) });
  }
  // el río nace y termina suave
  const idx = MUESTRAS_H.map((m, i) => m.zona === ZONA.RIO ? i : -1).filter(i => i >= 0);
  const ini = idx[0], fin = idx[idx.length - 1];
  for (const i of idx) MUESTRAS_H[i].rio = Math.min(1, (i - ini) / 25);
  // el río no se acaba en la arena: sigue su cauce hasta entrar al mar
  let boca = fin;
  while (boca < fin + 80 && costaDe(MUESTRAS_H[boca + 1].x, MUESTRAS_H[boca + 1].z) < 12){ boca++; MUESTRAS_H[boca].rio = 1; }
  MUESTRAS_H.rioIni = ini; MUESTRAS_H.rioFin = boca;
}

// mapa del mundo: distancia a la ruta, zona y muestra más cercana
const CERCA_H = HUELLA ? (() => {
  const L = 275, N = 221, paso = 2 * L / (N - 1);
  const dist = new Float32Array(N * N), cual = new Uint16Array(N * N);
  const P = MUESTRAS_H.filter((_, i) => i % (esMovil ? 3 : 2) === 0);
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++){
    const x = gx * paso - L, z = gy * paso - L;
    let d = 1e9, k = 0;
    for (let i = 0; i < P.length; i++){ const q = (P[i].x - x) ** 2 + (P[i].z - z) ** 2; if (q < d){ d = q; k = i; } }
    dist[gy * N + gx] = Math.sqrt(d); cual[gy * N + gx] = k * (esMovil ? 3 : 2);
  }
  const cercano = (x, z) => {
    const gx = Math.round((x + L) / paso), gz = Math.round((z + L) / paso);
    if (gx < 0 || gz < 0 || gx >= N || gz >= N) return -1;
    return gz * N + gx;
  };
  const api = {
    dist(x, z){
      const fx = (x + L) / paso, fz = (z + L) / paso;
      if (fx < 0 || fz < 0 || fx >= N - 1 || fz >= N - 1) return 99;
      const ix = fx | 0, iz = fz | 0, tx = fx - ix, tz = fz - iz, o = iz * N + ix;
      return (dist[o] * (1 - tx) + dist[o + 1] * tx) * (1 - tz) + (dist[o + N] * (1 - tx) + dist[o + N + 1] * tx) * tz;
    },
    muestra(x, z){ const o = cercano(x, z); return o < 0 ? null : MUESTRAS_H[cual[o]]; },
    zona(x, z){ const m = api.muestra(x, z); return m ? m.zona : ZONA.BOSQUE; },
    // con bordes irregulares, para que un ecosistema se meta en el otro
    zonaSuave(x, z){ return api.zona(x + (ruido(x * .04 + 11, z * .04) - .5) * 30, z + (ruido(x * .04 - 5, z * .04 + 9) - .5) * 30); },
  };
  return api;
})() : null;

function profundidadRio(x, z){
  if (!CERCA_H) return 0;
  const m = CERCA_H.muestra(x, z);
  if (!m || m.rio <= 0) return 0;
  return 1.9 * m.rio * (1 - THREE.MathUtils.smoothstep(CERCA_H.dist(x, z), 1.8, 5.5));
}
function alturaH(x, z){ return alturaBaseH(x, z) - profundidadRio(x, z); }
function nivelAgua(x, z){ return alturaBaseH(x, z) - .42; }

/* Cielo */
const cielo = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uSol: { value: SOL_DIR }, uT: { value: 0 }, uTarde: U_TARDE },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z = gl_Position.w; }`,
    fragmentShader: HUELLA ? CIELO_HUELLA : `
      varying vec3 vDir; uniform vec3 uSol; uniform float uT;
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
        return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
      void main(){
        vec3 dir = normalize(vDir);
        float y = dir.y;
        float d = max(dot(dir, normalize(uSol)), 0.0);
        // atardecer: naranja encendido abajo, rosa en medio, violeta arriba
        vec3 horiz = vec3(1.0, 0.36, 0.06);
        vec3 bajo  = vec3(1.0, 0.46, 0.1);
        vec3 rosa  = vec3(1.0, 0.4, 0.22);
        vec3 malva = vec3(0.78, 0.3, 0.36);
        vec3 cenit = vec3(0.16, 0.12, 0.34);
        vec3 c = mix(horiz, bajo, smoothstep(0.0, 0.07, y));
        c = mix(c, rosa, smoothstep(0.06, 0.24, y));
        c = mix(c, malva, smoothstep(0.22, 0.5, y));
        c = mix(c, cenit, smoothstep(0.42, 0.9, y));
        c = mix(c, vec3(0.94, 0.53, 0.29), smoothstep(0.0, -0.15, y));
        // resplandor del sol
        c = mix(c, vec3(1.0, 0.5, 0.1), pow(d, 5.0) * 0.75);
        c += vec3(1.0, 0.45, 0.08) * pow(d, 18.0) * 0.8;
        c += vec3(1.0, 0.75, 0.35) * pow(d, 160.0) * 1.6;
        c += vec3(1.0, 0.92, 0.7) * smoothstep(0.9986, 0.9993, d) * 7.0;
        // nubes alargadas encendidas por debajo
        float az = atan(dir.z, dir.x);
        float n = vn(vec2(az * 7.0 + uT * .004, y * 28.0)) * .6 + vn(vec2(az * 19.0 - uT * .006, y * 70.0)) * .4;
        float banda = smoothstep(0.03, 0.09, y) * smoothstep(0.34, 0.14, y);
        vec3 nube = mix(vec3(0.62, 0.25, 0.36), vec3(1.0, 0.6, 0.28), pow(d, 3.0) * 0.8 + 0.25);
        c = mix(c, nube, smoothstep(0.56, 0.78, n) * banda * 0.75);
        c += vec3(1.0, 0.55, 0.2) * smoothstep(0.7, 0.8, n) * banda * pow(d, 4.0) * 0.6;   // bordes dorados
        gl_FragColor = vec4(c,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
scene.add(cielo);

// Vuelo de dron: arranca alto, baja en picada, pasa rasante entre las flores y vuelve a subir
const rutaDron = HUELLA ? RUTA_HUELLA : new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 17, 56),  new THREE.Vector3(-10, 8, 38),  new THREE.Vector3(-7, 2.8, 21),
  new THREE.Vector3(4, 2.4, 7),  new THREE.Vector3(16, 2.7, -8), new THREE.Vector3(13, 3.6, -26),
  new THREE.Vector3(-5, 2.5, -37), new THREE.Vector3(-25, 3.0, -28), new THREE.Vector3(-37, 6.5, -8),
  new THREE.Vector3(-33, 11, 14), new THREE.Vector3(-19, 15, 44),
], true, 'centripetal');

// mapa de cercanía al camino de la cámara: ahí el zacate es más tupido
const CERCA = HUELLA ? (x, z) => CERCA_H.dist(x, z) : (() => {
  const N = 110, L = 70, m = new Float32Array(N * N);
  const pts = rutaDron.getSpacedPoints(260);
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++){
    const x = (gx / (N - 1)) * 2 * L - L, z = (gy / (N - 1)) * 2 * L - L;
    let d = 1e9; for (const p of pts) d = Math.min(d, (p.x - x) ** 2 + (p.z - z) ** 2);
    m[gy * N + gx] = Math.sqrt(d);
  }
  return (x, z) => {
    const gx = Math.round((x + L) / (2 * L) * (N - 1)), gy = Math.round((z + L) / (2 * L) * (N - 1));
    if (gx < 0 || gy < 0 || gx >= N || gy >= N) return 99;
    return m[gy * N + gx];
  };
})();

/* Luces */
const hemi = HUELLA ? new THREE.HemisphereLight('#dcecff', '#4f7a2a', 1.15) : new THREE.HemisphereLight('#ffc08e', '#3b4a16', 1.2);
scene.add(hemi);
const sol = new THREE.DirectionalLight(HUELLA ? '#fff0d8' : '#ff9d52', HUELLA ? 2.4 : 2.9);
sol.position.copy(SOL_DIR).multiplyScalar(100);
scene.add(sol);
const contra = new THREE.DirectionalLight(HUELLA ? '#ffe9f0' : '#ffd9ae', HUELLA ? .7 : 1.3);
if (HUELLA) contra.position.set(-0.3, 0.5, -1); else contra.position.set(0.4, 0.6, 1);
scene.add(contra);

/* Suelo */
if (HUELLA) sueloHuella(); else {
  const g = new THREE.PlaneGeometry(900, 900, 220, 220);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [];
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, altura(x, z) - 0.02);
    const n = fbm(x * .06, z * .06), r = Math.hypot(x, z);
    if (HUELLA) c.setRGB(.12 + n * .1, .25 + n * .13, .05); else c.setRGB(.13 + n * .1, .24 + n * .12, .04);
    const lejos = THREE.MathUtils.smoothstep(r, 45, 140);          // a lo lejos el suelo se vuelve oro
    c.lerp(HUELLA ? new THREE.Color(.3 + n * .12, .46 + n * .12, .16) : new THREE.Color(.62 + n * .2, .45 + n * .12, .07), lejos * .85);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vMundo;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvMundo = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vMundo;
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
        return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 q = vMundo.xz;
      float fino = vn(q * vec2(34., 9.)) * .55 + vn(q * vec2(9., 36.)) * .45;   // hebras
      float mancha = vn(q * .7) * .6 + vn(q * 2.3) * .4;
      diffuseColor.rgb *= .62 + fino * .5 + mancha * .22;
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(1.15, 1.08, .7), smoothstep(.55, .8, mancha) * .5);`);
  };
  scene.add(new THREE.Mesh(g, mat));
}

/* ════════════════════════════════════════════════════════════════════
   Piezas de flores (geometría procedural con color por vértice)
   ════════════════════════════════════════════════════════════════════ */
function pintar(g, colorA, colorB = colorA, eje = 'y', tinte = 0){
  if (g.attributes.uv) g.deleteAttribute('uv');
  if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
  const p = g.attributes.position, arr = new Float32Array(p.count * 3);
  let mn = Infinity, mx = -Infinity;
  const get = i => eje === 'y' ? p.getY(i) : eje === 'z' ? p.getZ(i) : Math.hypot(p.getX(i), p.getZ(i));
  for (let i = 0; i < p.count; i++){ const v = get(i); mn = Math.min(mn, v); mx = Math.max(mx, v); }
  const a = new THREE.Color(colorA), b = new THREE.Color(colorB), c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const t = mx > mn ? (get(i) - mn) / (mx - mn) : 0;
    c.copy(a).lerp(b, t); arr[i*3] = c.r; arr[i*3+1] = c.g; arr[i*3+2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  g.setAttribute('aTinte', new THREE.BufferAttribute(new Float32Array(p.count).fill(tinte), 1));
  return g;
}

/* Pétalo: sale del origen hacia +Z; `copa` lo curva hacia +Y, `caida` dobla la punta */
function petalo({ largo = 1, ancho = .3, copa = .1, caida = 0, segL = 5, segA = 3, punta = 1, base = '#ffb000', tip = '#ffe070', forma = 0.8, tinte = 1 }){
  const pos = [], idx = [], col = [];
  const cb = new THREE.Color(base), ct = new THREE.Color(tip), c = new THREE.Color();
  for (let i = 0; i <= segL; i++){
    const u = i / segL;
    let w = Math.pow(Math.sin(Math.PI * Math.min(u * (0.55 + 0.45 * punta) + 0.001, 1)), forma) * ancho;
    if (punta < 1) w = Math.max(w, ancho * 0.25 * Math.sin(Math.PI * u * 0.5 + 0.5));
    for (let j = 0; j <= segA; j++){
      const v = j / segA * 2 - 1;
      const x = v * w;
      const z = u * largo;
      const y = (v * v) * copa * Math.sin(Math.PI * u) + caida * u * u * largo;
      pos.push(x, y, z);
      c.copy(cb).lerp(ct, Math.pow(u, .8)); col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < segL; i++) for (let j = 0; j < segA; j++){
    const a = i * (segA + 1) + j, b = a + segA + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aTinte', new THREE.Float32BufferAttribute(new Array(pos.length / 3).fill(tinte), 1));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

function tallo(alto, grosor = .014, color = '#4e7a1e', curva = 0){
  const puntos = [];
  for (let i = 0; i <= 6; i++){ const t = i / 6; puntos.push(new THREE.Vector3(Math.sin(t * 2.2) * curva, t * alto, 0)); }
  const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(puntos), 4, grosor, 4, false);
  return pintar(g, '#3d6317', color);
}

function hoja(largo, ancho, ang, alto, giro){
  const g = petalo({ largo, ancho, copa: ancho * .5, caida: -.35, segL: 4, segA: 2, base: '#3f6a18', tip: '#6f9a2a', forma: .9, tinte: 0 });
  g.rotateX(-ang); g.rotateY(giro); g.translate(0, alto, 0);
  return g;
}

/* ── Girasol ─────────────────────────────────────────────────────── */
function crearGirasol(){
  const partes = [];
  const H = 1.0;                                      // se escala por instancia
  partes.push(tallo(H, .02, '#5b8a22', .05));
  partes.push(hoja(.3, .15, .6, H * .3, 0.4), hoja(.28, .14, .7, H * .5, 3.4), hoja(.24, .12, .55, H * .7, 1.9));
  const cabeza = [];
  const R = .15;
  // disco abombado, con anillos de color como el de verdad
  const disco = new THREE.RingGeometry(.002, R * .98, 28, 5);
  {
    const p = disco.attributes.position;
    for (let i = 0; i < p.count; i++){ const r = Math.hypot(p.getX(i), p.getY(i)) / R; p.setZ(i, (1 - r * r) * .03); }
    disco.computeVertexNormals();
  }
  const d = disco; d.deleteAttribute('uv');
  {
    const p = d.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
    const cCentro = new THREE.Color('#4a4010'), cOscuro = new THREE.Color('#1f0e03'), cAro = new THREE.Color('#5c2f08'), cBorde = new THREE.Color('#a86a14');
    for (let i = 0; i < p.count; i++){
      const r = Math.hypot(p.getX(i), p.getY(i)) / R;
      if (r < .22) c.copy(cCentro).lerp(cOscuro, r / .22);
      else if (r < .8) c.copy(cOscuro).lerp(cAro, (r - .22) / .58 * .7);
      else c.copy(cAro).lerp(cBorde, (r - .8) / .2);
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    d.setAttribute('color', new THREE.BufferAttribute(col, 3));
    d.setAttribute('aTinte', new THREE.BufferAttribute(new Float32Array(p.count), 1));
  }
  cabeza.push(d);
  // tres coronas de pétalos puntiagudos, cada uno un poco distinto
  const coronas = [
    { n: 20, largo: .16, ancho: .034, z: .004,  giro: 0,   tilt: .08,  base: '#e98a00', tip: '#ffd93d' },
    { n: 18, largo: .145, ancho: .032, z: -.002, giro: .16, tilt: -.1,  base: '#e07c00', tip: '#ffc928' },
    { n: 10, largo: .07, ancho: .022, z: .012,  giro: .07, tilt: .35,  base: '#d97400', tip: '#ffb81c' },
  ];
  coronas.forEach((k, capa) => {
    for (let i = 0; i < k.n; i++){
      const var1 = hash(i, capa + 1), var2 = hash(i + 7, capa + 3);
      const p = petalo({ largo: k.largo * (.88 + var1 * .24), ancho: k.ancho * (.9 + var2 * .2), copa: .012, caida: (var2 - .5) * .25,
        segL: 4, segA: 2, punta: .85, base: k.base, tip: k.tip, forma: .7 });
      p.rotateX(-Math.PI / 2);                         // apunta hacia +Y (en el plano de la cara)
      p.rotateZ((var1 - .5) * .15);                    // un leve giro sobre su eje
      p.translate(0, R * .9, k.z);
      p.rotateZ((i / k.n) * Math.PI * 2 + k.giro + (var2 - .5) * .1);
      // inclina la corona hacia adelante o atrás
      const th = (i / k.n) * Math.PI * 2 + k.giro;
      const m = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(Math.cos(th), Math.sin(th), 0), k.tilt * .5);
      p.applyMatrix4(m);
      cabeza.push(p);
    }
  });
  // brácteas verdes puntiagudas detrás de los pétalos
  for (let i = 0; i < 12; i++){
    const b = petalo({ largo: .06, ancho: .02, copa: .006, caida: .3, segL: 2, segA: 1, punta: .9, base: '#3c6516', tip: '#6e9a2c', forma: .8 });
    b.rotateX(-Math.PI / 2); b.translate(0, R * .75, -.022); b.rotateZ(i / 12 * Math.PI * 2 + .2);
    cabeza.push(b);
  }
  const caliz = new THREE.SphereGeometry(R * .95, 12, 3, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2); caliz.scale(1, .45, 1);
  caliz.rotateX(Math.PI / 2); caliz.translate(0, 0, -.006);
  cabeza.push(pintar(caliz, '#3f6a18', '#5d8a24', 'z'));
  const cab = mergeGeometries(cabeza);
  cab.rotateX(.28);                                     // la cabeza pesa y se inclina un poquito
  cab.translate(0.05, H + .02, .04);
  partes.push(cab);
  return mergeGeometries(partes);
}

/* ── Rosa amarilla ───────────────────────────────────────────────── */
function crearRosa(){
  const Y = .6;
  const partes = [tallo(Y, .01, '#4f7c1d', .025)];
  // hojas compuestas: tres foliolos
  [[.22, .6], [.34, 3.7]].forEach(([h, g]) => {
    partes.push(hoja(.075, .04, .9, h, g), hoja(.06, .032, .6, h + .01, g + .55), hoja(.06, .032, .6, h + .01, g - .55));
  });
  const golden = Math.PI * (3 - Math.sqrt(5));
  const N = 20;
  for (let i = 0; i < N; i++){
    const t = i / (N - 1);
    const dentro = t < .35;
    const p = petalo({
      largo: .035 + t * .04, ancho: .022 + t * .032, copa: dentro ? .035 : .025 + t * .01,
      caida: dentro ? .5 - t : -.15 - (t - .35) * .7,           // los de adentro se cierran, los de afuera se abren y se enroscan hacia atrás
      segL: 4, segA: 2, punta: .65, forma: .5,
      base: dentro ? '#e08a00' : '#eea400', tip: dentro ? '#ffbe1c' : '#ffe067',
    });
    p.rotateX(-Math.PI / 2 + (dentro ? .06 + t * .5 : .28 + t * .75));
    p.rotateY(i * golden);
    p.translate(0, Y - t * .012, 0);
    partes.push(p);
  }
  for (let i = 0; i < 5; i++){
    const s = petalo({ largo: .04, ancho: .01, copa: .004, caida: -.4, segL: 3, segA: 2, punta: .9, base: '#3f6a18', tip: '#5e8c26' });
    s.rotateX(-Math.PI / 2 + 1.9); s.rotateY(i / 5 * Math.PI * 2 + .3); s.translate(0, Y - .01, 0);
    partes.push(s);
  }
  const receptaculo = new THREE.SphereGeometry(.014, 6, 4); receptaculo.scale(1, 1.3, 1); receptaculo.translate(0, Y - .014, 0);
  partes.push(pintar(receptaculo, '#3f6a18'));
  return mergeGeometries(partes);
}

/* ── Tulipán ─────────────────────────────────────────────────────── */
function crearTulipan(){
  const Y = .44;
  const partes = [tallo(Y, .01, '#5a8a25', .015)];
  [[.3, -1.2, .3], [.26, -1.1, 3.5]].forEach(([l, x, g]) => {
    const h = petalo({ largo: l, ancho: .045, copa: .04, caida: -.18, segL: 5, segA: 2, base: '#4a7a1c', tip: '#7aa83c', forma: .8 });
    h.rotateX(x); h.rotateY(g); partes.push(h);
  });
  for (let capa = 0; capa < 2; capa++) for (let i = 0; i < 3; i++){
    const p = petalo({ largo: .095, ancho: .042, copa: .05, caida: -.12, segL: 4, segA: 2, punta: .9, forma: .55,
      base: capa ? '#e05a00' : '#e87000', tip: capa ? '#ffcf20' : '#ffe04a' });
    p.rotateX(-Math.PI / 2 + .2 + capa * .06);
    p.rotateY(i * Math.PI * 2 / 3 + capa * Math.PI / 3);
    p.translate(0, Y, 0);
    const s = capa ? 1 : .95; p.scale(s, s, s);
    partes.push(p);
  }
  return mergeGeometries(partes);
}

/* ── Rudbeckia (margarita de ojo negro) ─────────────────────────── */
function crearMargarita(){
  const Y = .5;
  const partes = [tallo(Y, .006, '#557f20', .03), hoja(.1, .028, .9, .15, .8), hoja(.08, .024, .9, .26, 3.9)];
  for (let capa = 0; capa < 1; capa++){
    const n = 15;
    for (let i = 0; i < n; i++){
      const p = petalo({ largo: .06 - capa * .006, ancho: .014, copa: .006, caida: -.32 - hash(i, capa) * .2, segL: 3, segA: 1, punta: .75, forma: .6,
        base: '#d97a00', tip: '#ffd21c' });
      p.rotateY((i + capa * .5) / n * Math.PI * 2);
      p.translate(0, Y - capa * .003, 0);
      partes.push(p);
    }
  }
  const c = new THREE.SphereGeometry(.018, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2); c.scale(1, 1.35, 1); c.translate(0, Y, 0);
  partes.push(pintar(c, '#3b1c05', '#150801'));

}

/* ── Gerbera amarilla ────────────────────────────────────────────── */
function crearGerbera(){
  const Y = .46;
  const partes = [tallo(Y, .007, '#5a8a24', .02)];
  for (let i = 0; i < 4; i++){ const h = petalo({ largo: .12, ancho: .03, copa: .02, caida: -.2, segL: 4, segA: 2, base: '#3f6a18', tip: '#6c9a2a' }); h.rotateX(-1.35); h.rotateY(i * 1.6); partes.push(h); }
  for (let capa = 0; capa < 2; capa++){
    const n = capa ? 14 : 20;
    for (let i = 0; i < n; i++){
      const p = petalo({ largo: capa ? .05 : .072, ancho: capa ? .008 : .011, copa: .003, caida: capa ? .15 : -.05, segL: 3, segA: 1, punta: .8, forma: .45,
        base: capa ? '#e8a000' : '#f5b000', tip: capa ? '#ffd23a' : '#ffe35a' });
      p.rotateX(capa ? -.2 : 0);
      p.rotateY((i + capa * .5) / n * Math.PI * 2);
      p.translate(0, Y + capa * .004, 0);
      partes.push(p);
    }
  }
  const c = new THREE.CylinderGeometry(.018, .02, .008, 12); c.translate(0, Y + .004, 0);
  partes.push(pintar(c, '#7a6a12', '#3a3006'));

  partes.push(pintar(aro, '#e8b21a'));

}

/* ── Cempasúchil ─────────────────────────────────────────────────── */
function crearCempasuchil(){
  const Y = .34;
  const partes = [tallo(Y, .008, '#4d7a1c', .02)];
  for (let i = 0; i < 4; i++){ const h = hoja(.08, .018, .8, .1 + i * .05, i * 1.7); partes.push(h); }
  const golden = Math.PI * (3 - Math.sqrt(5));
  const N = 44;
  for (let i = 0; i < N; i++){
    const t = i / N;
    const p = petalo({ largo: .026 + t * .012, ancho: .018, copa: .012, caida: -.3 + hash(i, 2) * .4, segL: 2, segA: 2, forma: .45, punta: .55,
      base: '#e86400', tip: t > .6 ? '#ff9e00' : '#ffb81a' });
    p.rotateZ((hash(i, 5) - .5) * .8);                 // volantes: cada pétalo girado distinto
    p.rotateX(-Math.PI / 2 + .1 + t * 1.55);
    p.rotateY(i * golden);
    p.translate(0, Y, 0);
    partes.push(p);
  }
  return mergeGeometries(partes);
}

/* ── Lirio amarillo ──────────────────────────────────────────────── */
function crearLirio(){
  const Y = .64;
  const partes = [tallo(Y, .009, '#4f7f1f', .03), hoja(.17, .022, .7, .2, .4), hoja(.16, .02, .7, .32, 2.6), hoja(.14, .02, .7, .44, 4.5)];
  for (let i = 0; i < 6; i++){
    const p = petalo({ largo: .11, ancho: .03, copa: .02, caida: -.75, segL: 5, segA: 2, punta: .9, base: '#ff8a00', tip: '#ffe45c', forma: .6 });
    p.rotateX(-Math.PI / 2 + .55 + (i % 2) * .12);
    p.rotateY(i * Math.PI / 3 + (i % 2) * .1);
    p.translate(0, Y, 0);
    partes.push(p);
  }
  for (let i = 0; i < 6; i++){
    const a = i * Math.PI / 3 + .5, fin = new THREE.Vector3(Math.cos(a) * .04, Y + .075, Math.sin(a) * .04);
    const e = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, Y, 0), new THREE.Vector3(fin.x * .3, Y + .06, fin.z * .3), fin), 3, .0018, 3, false);
    partes.push(pintar(e, '#d9c060'));
    const an = new THREE.CapsuleGeometry(.0035, .013, 1, 4); an.rotateZ(Math.PI / 2); an.rotateY(-a); an.translate(fin.x, fin.y, fin.z);
    partes.push(pintar(an, '#a8350a'));
  }
  return mergeGeometries(partes);
}

/* ── Florcita de suelo (botón de oro) ───────────────────────────── */
function crearBoton(){
  const partes = [tallo(.15, .004, '#5c8a22', .01)];

    const p = petalo({ largo: .028, ancho: .018, copa: .01, caida: .25, segL: 3, segA: 2, base: '#f2b300', tip: '#fff06a', forma: .5, punta: .6 });

/* ── Montañas al fondo: capas con perspectiva atmosférica ────────── */
const GLSL_RUIDO = `
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }`;
const NIEBLA = new THREE.Color('#f0874a');
function cordillera({ radio, alto, freq, sem, cima, brillo, bruma, niebla = null, borde = [1, .66, .32], nieve = 0, suave = 0 }){
  const seg = 1400, pos = [], top = [], ang = [], sol = [], idx = [];
  const aSol = Math.atan2(SOL_DIR.z, SOL_DIR.x);
  for (let i = 0; i <= seg; i++){
    const a = i / seg * Math.PI * 2;
    const nx = Math.cos(a) * freq + sem, nz = Math.sin(a) * freq - sem;
    const n = fbm(nx, nz);
    const cresta = 1 - Math.abs(ruido(nx * 2.6, nz * 2.6) * 2 - 1);
    const fino = ruido(nx * 9, nz * 9) - .5;
    let h = alto * (.12 + .88 * Math.pow(n, 1.8)) + (cresta * cresta * alto * .28 + fino * alto * .05) * (1 - suave);
    h += Math.pow(Math.max(0, fbm(nx * .5 + 40, nz * .5)), 5) * alto * 1.6;          // algún volcán
    const haciaSol = Math.max(0, Math.cos(a - aSol));
    h *= 1 - .55 * Math.pow(haciaSol, 10);                                            // valle donde se pone el sol
    if (HUELLA) h *= 1 - THREE.MathUtils.smoothstep(-Math.cos(a), .3, .72);            // hacia el oeste: el mar
    const x = Math.cos(a) * radio, z = Math.sin(a) * radio;
    pos.push(x, h, z, x, -40, z);
    top.push(h, h); ang.push(a, a); sol.push(Math.pow(haciaSol, 3), Math.pow(haciaSol, 3));
    if (i < seg){ const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aTop', new THREE.Float32BufferAttribute(top, 1));
  g.setAttribute('aAng', new THREE.Float32BufferAttribute(ang, 1));
  g.setAttribute('aSolar', new THREE.Float32BufferAttribute(sol, 1));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    fog: false, side: THREE.DoubleSide,
    uniforms: { uCima: { value: new THREE.Color(cima) }, uBruma: { value: niebla ? new THREE.Color(niebla) : NIEBLA }, uBorde: { value: new THREE.Color().setRGB(...borde) }, uNieve: { value: nieve }, uAlto: { value: alto }, uBrillo: { value: brillo }, uNiebla: { value: bruma } },
    vertexShader: `attribute float aTop; attribute float aAng; attribute float aSolar;
      varying float vY; varying float vTop; varying float vAng; varying float vSol;
      void main(){ vY = position.y; vTop = aTop; vAng = aAng; vSol = aSolar;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uCima; uniform vec3 uBruma; uniform float uBrillo; uniform float uNiebla; uniform vec3 uBorde; uniform float uNieve; uniform float uAlto;
      varying float vY; varying float vTop; varying float vAng; varying float vSol;
      ${GLSL_RUIDO}
      void main(){
        float t = clamp(vY / max(vTop, 1.), 0., 1.);
        // cárcavas y laderas: vetas verticales de erosión
        float vetas = vn(vec2(vAng * 420., vY * .05)) * .55 + vn(vec2(vAng * 1500., vY * .18)) * .3 + vn(vec2(vAng * 90., vY * .02)) * .15;
        vec3 c = uCima * (.86 + vetas * .22);
        // borde encendido por el sol en las crestas
        float borde = smoothstep(.975, 1., t) * vSol * uBrillo;
        c = mix(c, uBorde, borde * .6);
        c = mix(c, vec3(.96, .97, 1.), smoothstep(uAlto * .52, uAlto * .7, vY + (vetas - .5) * uAlto * .05) * uNieve);   // nieve en las cumbres
        c *= .9 + .1 * t;
        // bruma naranja que sube desde abajo
        float bruma = (1. - smoothstep(-.05, .9, t)) * .85 + uNiebla;
        c = mix(c, uBruma, clamp(bruma, 0., 1.));
        gl_FragColor = vec4(c, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  const mesh = new THREE.Mesh(g, m); mesh.renderOrder = -1; return mesh;
}

/* ════════════════════════════════════════════════════════════════════
   Material con viento + brote (cada instancia nace a su tiempo)
   ════════════════════════════════════════════════════════════════════ */
const U = { uTime: { value: 0 }, uViento: { value: 1 } };

function materialFlor(opts = {}, tintarPetalos = false, amp = 0.16){
  const m = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, emissive: '#3a1800', emissiveIntensity: .2, ...opts });
  m.onBeforeCompile = (s) => {
    s.uniforms.uTime = U.uTime; s.uniforms.uViento = U.uViento;
    s.vertexShader = s.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aNace; attribute float aFase; ${tintarPetalos ? 'attribute float aTinte;' : ''}
        uniform float uTime; uniform float uViento;`)
      .replace('#include <begin_vertex>', `
        float g = clamp((uTime - aNace) / 1.7, 0.0, 1.0);
        float crece = g < 1.0 ? (1.0 - pow(1.0 - g, 3.0)) + sin(g * 3.14159) * 0.14 : 1.0;
        vec3 transformed = position * crece;
        vec3 wpos = (instanceMatrix * vec4(0.,0.,0.,1.)).xyz;
        float h = max(position.y, 0.0);
        float ola = sin(uTime * 0.9 - wpos.x * 0.11 + wpos.z * 0.05) * 0.5 + 0.5;       // ráfagas que cruzan la pradera
        float w = (sin(uTime * 1.7 + aFase + wpos.x * 0.6) * 0.35 + sin(uTime * 2.9 + aFase * 1.7) * 0.12 + ola * 0.8) * uViento;
        mat3 imW = mat3(instanceMatrix);
        vec3 dirLocal = transpose(imW) * vec3(0.85, 0.0, 0.35);
        dirLocal /= max(dot(imW[0], imW[0]), 1e-4);
        transformed += dirLocal * w * h * h * ${amp.toFixed(3)};
        transformed.y -= w * w * h * h * ${(amp * .125).toFixed(4)};
      `);
    if (tintarPetalos) s.vertexShader = s.vertexShader.replace('#include <color_vertex>', `
      vColor = vec3(1.0);
      #ifdef USE_COLOR
        vColor *= color;
      #endif
      #ifdef USE_INSTANCING_COLOR
        vColor = mix(vColor, vColor * instanceColor.xyz, aTinte);
      #endif`);
  };
  m.customProgramCacheKey = () => 'flor' + tintarPetalos + amp;
  return m;
}

const matFlor = HUELLA ? materialFlor({}, true) : materialFlor();

/* ════════════════════════════════════════════════════════════════════
   Siembra
   ════════════════════════════════════════════════════════════════════ */
const R_PRADERA = 64;
const especies = [];
const dummy = new THREE.Object3D();
// La pradera se divide en parcelas: solo se dibujan las que la cámara está viendo
const MUNDO_L = HUELLA ? 280 : 70, GRID = HUELLA ? (esMovil ? 11 : 16) : 7, LADO = 2 * MUNDO_L / GRID;
const celda = (x, z) => Math.min(GRID - 1, Math.max(0, Math.floor((x + MUNDO_L) / LADO))) + GRID * Math.min(GRID - 1, Math.max(0, Math.floor((z + MUNDO_L) / LADO)));

function geoCompartida(geo, n){
  const g = new THREE.BufferGeometry();
  g.setIndex(geo.index);
  for (const k in geo.attributes) g.setAttribute(k, geo.attributes[k]);    // se comparte en la GPU, no se copia
  g.boundingSphere = geo.boundingSphere;
  const nace = new Float32Array(n).fill(-100), fase = new Float32Array(n);
  for (let i = 0; i < n; i++) fase[i] = rnd() * 6.28;
  g.setAttribute('aNace', new THREE.InstancedBufferAttribute(nace, 1));
  g.setAttribute('aFase', new THREE.InstancedBufferAttribute(fase, 1));
  return g;
}

function sembrar({ geo, n, extra, escala, mascara, mirarSol = false, radio = R_PRADERA, inclinar = .12, tinte = null, centro = null,
                   ruta = 0, grupo = 'flor', lejos = 60, mat = null, agua = false, nombre = '', enPlaya = false }){
  const material = mat || matFlor;
  if (HUELLA && esMovil && lejos < 150) lejos *= .78;   // en el celular, lo pequeño se deja de dibujar un poco antes
  geo.computeBoundingSphere();
  const base = Math.floor(n * Q);
  const cubetas = Array.from({ length: GRID * GRID }, () => []);
  let i = 0, intentos = 0;
  while (i < base && intentos < base * 40){
    intentos++;
    let x, z;
    if (ruta){                                   // en la huella todo crece a lo largo del viaje
      const m = MUESTRAS_H[(rnd() * MUESTRAS_H.length) | 0], off = (rnd() * 2 - 1) * ruta;
      x = m.x + m.nx * off; z = m.z + m.nz * off;
    } else {
      const r = Math.sqrt(rnd()) * radio, a = rnd() * Math.PI * 2;
      x = (centro ? centro[0] : 0) + Math.cos(a) * r; z = (centro ? centro[1] : 0) + Math.sin(a) * r;
    }
    if (HUELLA && !enPlaya && x < -60){ const c = costaDe(x, z); if (c > -70 || (c > -104 && rnd() < THREE.MathUtils.smoothstep(c, -104, -70))) continue; }   // la vegetación se va raleando hacia la playa
    if (mascara && mascara(x, z) < rnd()) continue;
    if (mirarSol && CERCA(x, z) < 1.3) continue;              // que el dron no atraviese girasoles
    cubetas[celda(x, z)].push(x, z);
    i++;
  }
  const yFn = agua ? nivelAgua : null;
  const parcelas = [];
  for (const c of cubetas){
    const k = c.length / 2; if (!k) continue;
    const mesh = new THREE.InstancedMesh(geoCompartida(geo, k), material, k);
    for (let j = 0; j < k; j++){ colocar(mesh, j, c[j*2], c[j*2+1], escala, mirarSol, inclinar, yFn); if (tinte) mesh.setColorAt(j, tinte(c[j*2], c[j*2+1])); }
    mesh.computeBoundingSphere(); mesh.boundingSphere.radius += 1.5;
    mesh.userData.n0 = k; mesh.userData.lejos = lejos;
    scene.add(mesh); parcelas.push(mesh);
    if (HUELLA) CULL.push(mesh);
  }
  // reserva para lo que ella siembra tocando (se dibujan solo las que ya nacieron)
  const reserva = new THREE.InstancedMesh(geoCompartida(geo, extra), material, extra);
  reserva.geometry.attributes.aNace.array.fill(1e6);
  if (tinte) for (let j = 0; j < extra; j++) reserva.setColorAt(j, tinte());
  reserva.count = 0; reserva.frustumCulled = false; reserva.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  if (extra) scene.add(reserva);
  especies.push({ parcelas, reserva, extra, siguiente: 0, escala, mirarSol, inclinar, grupo, nombre });
}

function colocar(mesh, i, x, z, [e0, e1], mirarSol, inclinar, yFn = null){
  dummy.position.set(x, yFn ? yFn(x, z) : altura(x, z), z);
  const s = rango(e0, e1);
  dummy.scale.set(s, s * rango(.85, 1.15), s);
  const giro = mirarSol ? (HUELLA ? Math.atan2(SOL_DIR.x, SOL_DIR.z) : Math.atan2(-SOL_DIR.x, -SOL_DIR.z)) + rango(-.6, .6) : rnd() * Math.PI * 2;
  dummy.rotation.set(rango(-inclinar, inclinar), giro, rango(-inclinar, inclinar), 'YXZ');
  dummy.updateMatrix();
  mesh.setMatrixAt(i, dummy.matrix);
}

// cuántas flores de verdad hay ahora mismo en la pradera
function floresReales(){
  let n = 0;
  for (const e of especies){
    if (e.grupo !== 'flor' && !(HUELLA && e.grupo === 'arbol')) continue;
    for (const m of e.parcelas) n += m.count; n += e.reserva.count;
  }
  if (HUELLA){                                     // en la huella cuenta todo lo vivo: también aves y mariposas
    for (const b of aves) if (!b.libre || b.nace >= 0) n++;
    for (const a of animales) if (!a.libre || a.nace >= 0) n++;
    for (const b of mariposas) if (!b.libre || b.nace >= 0) n++;
  }
  return n;
}

const jitter = (g, k) => {
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), s = 1 + (hash(x * 9.1 + z * 3.7, y * 7.3) - .5) * k;
    p.setXYZ(i, x * s, y * s, z * s);
  }
  g.computeVertexNormals();
  return g;
};

function crearTulipanH(){
  const Y = .44;
  const partes = [tallo(Y, .01, '#5a8a25', .015)];
  [[.3, -1.2, .3], [.26, -1.1, 3.5]].forEach(([l, x, g]) => {
    const h = petalo({ largo: l, ancho: .045, copa: .04, caida: -.18, segL: 5, segA: 2, base: '#4a7a1c', tip: '#7aa83c', forma: .8, tinte: 0 });
    h.rotateX(x); h.rotateY(g); partes.push(h);
  });
  for (let capa = 0; capa < 2; capa++) for (let i = 0; i < 3; i++){
    const p = petalo({ largo: .095, ancho: .042, copa: .05, caida: -.12, segL: 4, segA: 2, punta: .9, forma: .55, base: capa ? '#b4a3ab' : '#c9bcc2', tip: '#ffffff' });
    p.rotateX(-Math.PI / 2 + .2 + capa * .06); p.rotateY(i * Math.PI * 2 / 3 + capa * Math.PI / 3); p.translate(0, Y, 0);
    const s = capa ? 1 : .95; p.scale(s, s, s);
    partes.push(p);
  }
  return mergeGeometries(partes);
}
function crearRosaH(){
  const Y = .6;
  const partes = [tallo(Y, .01, '#4f7c1d', .025)];
  [[.22, .6], [.34, 3.7]].forEach(([h, g]) => partes.push(hoja(.075, .04, .9, h, g), hoja(.06, .032, .6, h + .01, g + .55), hoja(.06, .032, .6, h + .01, g - .55)));
  const golden = Math.PI * (3 - Math.sqrt(5)), N = 20;
  for (let i = 0; i < N; i++){
    const t = i / (N - 1), dentro = t < .35;
    const p = petalo({ largo: .035 + t * .04, ancho: .022 + t * .032, copa: dentro ? .035 : .025 + t * .01, caida: dentro ? .5 - t : -.15 - (t - .35) * .7,
      segL: 4, segA: 2, punta: .65, forma: .5, base: dentro ? '#9c8a92' : '#c4b4bb', tip: dentro ? '#e6dce0' : '#ffffff' });
    p.rotateX(-Math.PI / 2 + (dentro ? .06 + t * .5 : .28 + t * .75)); p.rotateY(i * golden); p.translate(0, Y - t * .012, 0);
    partes.push(p);
  }
  const receptaculo = new THREE.SphereGeometry(.014, 6, 4); receptaculo.scale(1, 1.3, 1); receptaculo.translate(0, Y - .014, 0);
  partes.push(pintar(receptaculo, '#3f6a18'));
  return mergeGeometries(partes);
}

}

function crearEspiga(){

function crearLirioH(){
  const Y = .64;
  const partes = [tallo(Y, .009, '#4f7f1f', .03), hoja(.17, .022, .7, .2, .4), hoja(.16, .02, .7, .32, 2.6), hoja(.14, .02, .7, .44, 4.5)];
  for (let i = 0; i < 6; i++){
    const p = petalo({ largo: .11, ancho: .03, copa: .02, caida: -.75, segL: 5, segA: 2, punta: .9, base: '#dccad2', tip: '#ffffff', forma: .6 });
    p.rotateX(-Math.PI / 2 + .55 + (i % 2) * .12); p.rotateY(i * Math.PI / 3 + (i % 2) * .1); p.translate(0, Y, 0);
    partes.push(p);
  }
  for (let i = 0; i < 6; i++){
    const a = i * Math.PI / 3 + .5, fin = new THREE.Vector3(Math.cos(a) * .04, Y + .075, Math.sin(a) * .04);
    const e = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, Y, 0), new THREE.Vector3(fin.x * .3, Y + .06, fin.z * .3), fin), 3, .0018, 3, false);

/* ── Suelo de la huella: cada ecosistema con su tierra, roca y nieve ── */
function sueloHuella(){
  const cSuelo = new THREE.Color(), cz = new THREE.Color();
  const COLOR_ZONA = [[.09, .15, .05], [.12, .25, .06], [.13, .27, .06], [.44, .37, .14], [.14, .24, .08], [.2, .3, .1]];
  const colorSuelo = (x, z, y, c) => {
    const n = fbm(x * .06, z * .06);
    c.setRGB(0, 0, 0);
    for (const [dx, dz] of [[0, 0], [9, -6], [-7, 8]]){
      const k = COLOR_ZONA[CERCA_H.zonaSuave(x + dx, z + dz)];
      c.r += k[0] / 3; c.g += k[1] / 3; c.b += k[2] / 3;
    }
    c.multiplyScalar(.8 + n * .45);
    const prof = profundidadRio(x, z);
    if (prof > .1) c.lerp(cz.setRGB(.5, .45, .33), THREE.MathUtils.smoothstep(prof, .1, .5));
    if (prof > .9) c.lerp(cz.setRGB(.22, .24, .2), THREE.MathUtils.smoothstep(prof, .9, 1.7));
    c.lerp(cz.setRGB(.34 + n * .08, .33 + n * .07, .31 + n * .06), THREE.MathUtils.smoothstep(y + (n - .5) * 10, 22, 38) * .9);
    c.lerp(cz.setRGB(.93, .95, .98), THREE.MathUtils.smoothstep(y + (n - .5) * 14, 50, 60));
    const arenaF = THREE.MathUtils.smoothstep(costaDe(x, z) + (n - .5) * 30 + (ruido(x * .09, z * .09) - .5) * 14, -104, -70);   // la arena entra suave en la tierra
    if (arenaF > 0) c.lerp(cz.setRGB(.86 + n * .06, .78 + n * .06, .58), arenaF);
    return c;
  };
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vMundo;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvMundo = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vMundo;
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
        return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 q = vMundo.xz;
      float fino = vn(q * vec2(34., 9.)) * .55 + vn(q * vec2(9., 36.)) * .45;
      float mancha = vn(q * .7) * .6 + vn(q * 2.3) * .4;
      diffuseColor.rgb *= .7 + fino * .4 + mancha * .2;`);
  };
  mat.customProgramCacheKey = () => 'suelo-huella';
  const plano = (tam, seg, bajar, hueco) => {
    const g = new THREE.PlaneGeometry(tam, tam, seg, seg);
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++){
      const x = p.getX(i), z = p.getZ(i), y = alturaH(x, z) - .02 - bajar;
      p.setY(i, y);
      colorSuelo(x, z, y, cSuelo); col[i*3] = cSuelo.r; col[i*3+1] = cSuelo.g; col[i*3+2] = cSuelo.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    if (hueco){                                   // el anillo de afuera no pisa al de adentro
      const idx = g.index.array, nuevo = [];
      for (let i = 0; i < idx.length; i += 3){
        const cx = (p.getX(idx[i]) + p.getX(idx[i+1]) + p.getX(idx[i+2])) / 3, cz2 = (p.getZ(idx[i]) + p.getZ(idx[i+1]) + p.getZ(idx[i+2])) / 3;
        if (Math.abs(cx) < hueco && Math.abs(cz2) < hueco) continue;
        nuevo.push(idx[i], idx[i+1], idx[i+2]);
      }
      g.setIndex(nuevo);
    }
    g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, mat));
  };
  plano(480, esMovil ? 220 : 300, 0, 0);
  plano(1400, 80, .5, 232);
}

/* ── El río: una cinta de agua con reflejos que corre ────────────── */
function crearRio(){
  const N = MUESTRAS_H.length, pos = [], uv = [], idx = [], fin = [];
  let largo = 0, fila = 0;
  for (let i = MUESTRAS_H.rioIni; i <= MUESTRAS_H.rioFin; i++){
    const m = MUESTRAS_H[(i + N) % N], ant = MUESTRAS_H[(i - 1 + N) % N];
    largo += Math.hypot(m.x - ant.x, m.z - ant.z);
    const desemboca = THREE.MathUtils.smoothstep(costaDe(m.x, m.z), -75, 0);                 // en la desembocadura baja al nivel del mar
    const y = (alturaBaseH(m.x, m.z) - .42) * (1 - desemboca) + (NIVEL_MAR + .03) * desemboca, a = (.5 + 4.3 * Math.min(1, m.rio * 1.4)) * (1 + desemboca * .5);
    pos.push(m.x + m.nx * a, y, m.z + m.nz * a, m.x - m.nx * a, y, m.z - m.nz * a);
    uv.push(largo, 0, largo, 1);
    const f = THREE.MathUtils.smoothstep(costaDe(m.x, m.z), -22, -2); fin.push(f, f);           // al tocar el mar, el río se funde en él
    if (fila){ const k = (fila - 1) * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
    fila++;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aFin', new THREE.Float32BufferAttribute(fin, 1));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.ShaderMaterial({
    transparent: true, fog: true, side: THREE.DoubleSide,
    uniforms: { ...THREE.UniformsLib.fog, uTime: U.uTime, uSol: { value: SOL_DIR } },
    vertexShader: `attribute float aFin; varying float vFin; varying vec2 vUv; varying vec3 vMundo;
      #include <fog_pars_vertex>
      void main(){ vUv = uv; vFin = aFin; vMundo = (modelMatrix * vec4(position, 1.)).xyz;
        vec4 mvPosition = viewMatrix * vec4(vMundo, 1.); gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform float uTime; uniform vec3 uSol; varying float vFin; varying vec2 vUv; varying vec3 vMundo;
      #include <fog_pars_fragment>
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
        return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
      void main(){
        vec2 q = vec2(vUv.x * .45 - uTime * .55, vUv.y * 5.);
        float n1 = vn(q * 2.) * .6 + vn(q * 5.3 + 3.) * .4, n2 = vn(q * 3.1 + 7.) * .6 + vn(q * 7.7) * .4;
        vec3 nrm = normalize(vec3((n1 - .5) * .45, 1., (n2 - .5) * .45));
        vec3 V = normalize(cameraPosition - vMundo);
        float fres = pow(1. - max(dot(nrm, V), 0.), 3.);
        vec3 c = mix(vec3(.05, .24, .28), vec3(.62, .8, .97), .22 + fres * .65);
        c += vec3(1., .97, .9) * pow(max(dot(reflect(-V, nrm), normalize(uSol)), 0.), 90.) * 1.6;
        float orilla = smoothstep(.72, 1., abs(vUv.y * 2. - 1.));
        c = mix(c, vec3(.92, .96, 1.), orilla * smoothstep(.45, .8, n2) * .5);
        gl_FragColor = vec4(c, (.88 - orilla * .25) * (1. - vFin));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`
  });
  const agua = new THREE.Mesh(g, m); agua.renderOrder = 1; scene.add(agua);
}

/* ── El mar al oeste: olas que llegan a la orilla, espuma en las crestas y el sol reflejado ── */
function crearMar(){
  const uni = { ...THREE.UniformsLib.fog, uTime: U.uTime, uSol: { value: SOL_DIR }, uTarde: U_TARDE };
  const vert = (olas) => `uniform float uTime; varying vec3 vMundo; varying float vOla;
    #include <fog_pars_vertex>
    void main(){
      vec3 p = (modelMatrix * vec4(position, 1.)).xyz;
      float ola = 0.;
      ${olas ? `
      float cerca = smoothstep(-430., -205., p.x);
      float fase = p.x * .21 - uTime * 1.25 + sin(p.z * .045) * 1.6;
      ola = (pow(sin(fase) * .5 + .5, 2.2) - .35) * .6 * (.4 + cerca);
      ola += sin(p.x * .47 + p.z * .31 - uTime * 2.1) * .07 + sin(p.z * .38 - p.x * .12 - uTime * 1.6) * .06;
      p.y += ola;` : ''}
      vOla = ola; vMundo = p;
      vec4 mvPosition = viewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`;
  const frag = `uniform float uTime; uniform vec3 uSol; uniform float uTarde; varying vec3 vMundo; varying float vOla;
    #include <fog_pars_fragment>
    float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
    void main(){
      vec3 nG = normalize(cross(dFdx(vMundo), dFdy(vMundo)));
      if (nG.y < 0.) nG = -nG;
      vec2 q = vMundo.xz * .08;
      float a = vn(q + vec2(uTime * .1, uTime * .06)) * .6 + vn(q * 2.7 - vec2(uTime * .13, 0.)) * .4;
      float b = vn(q * 1.3 + vec2(3., uTime * .08)) * .6 + vn(q * 3.4 + vec2(uTime * .1, 7.)) * .4;
      float lej = smoothstep(80., 380., length(cameraPosition - vMundo));                   // de lejos el agua se alisa: sin rayas
      vec3 n = normalize(mix(nG + vec3((a - .5) * .3, 0., (b - .5) * .3), vec3(0., 1., 0.), lej));
      vec3 V = normalize(cameraPosition - vMundo);
      float fres = pow(1. - max(dot(n, V), 0.), 4.);
      vec3 hondo = mix(vec3(.02, .13, .26), vec3(.07, .07, .2), uTarde), claro = mix(vec3(.05, .34, .44), vec3(.2, .17, .3), uTarde);
      vec3 S = normalize(uSol);
      float haciaSol = pow(max(dot(normalize(vec3(-V.x, 0., -V.z)), normalize(vec3(S.x, 0., S.z))), 0.), 2.);
      vec3 cielo = mix(vec3(.56, .72, .92), mix(vec3(.72, .4, .55), vec3(1., .56, .24), haciaSol), uTarde);
      vec3 c = mix(hondo, claro, smoothstep(-330., -210., vMundo.x) * .8);
      c = mix(c, cielo, .05 + fres * .33);
      c *= .82 + .32 * smoothstep(-.45, .5, vOla);                                        // valles oscuros, crestas con luz
      c += mix(vec3(1., .97, .9), vec3(1., .6, .24), uTarde) * pow(max(dot(reflect(-V, n), S), 0.), mix(160., 38., uTarde)) * mix(2.2, 4.2, uTarde);   // camino del sol
      c = mix(c, mix(vec3(.95, .97, 1.), vec3(1., .88, .8), uTarde), smoothstep(.5, .78, vOla) * .6 * (1. - lej));   // espuma en la cresta
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`;
  const cerca = new THREE.Mesh(new THREE.PlaneGeometry(300, 800, esMovil ? 120 : 220, esMovil ? 200 : 360),
    new THREE.ShaderMaterial({ fog: true, uniforms: uni, vertexShader: vert(true), fragmentShader: frag }));
  cerca.rotation.x = -Math.PI / 2; cerca.position.set(-310, NIVEL_MAR, 0); cerca.frustumCulled = false;
  const lejos = new THREE.Mesh(new THREE.PlaneGeometry(2400, 3400, 1, 1),
    new THREE.ShaderMaterial({ fog: true, uniforms: uni, vertexShader: vert(false), fragmentShader: frag }));
  lejos.rotation.x = -Math.PI / 2; lejos.position.set(-1660, NIVEL_MAR - .05, 0);
  scene.add(cerca, lejos);
  olasMar = cerca;
}
let olasMar = null;

/* ════════════════════════════════════════════════════════════════════
   EL MAR — espuma en la orilla, conchas y caracoles en la arena, palmeras
   ════════════════════════════════════════════════════════════════════ */
const NIVEL_MAR = -1.1;
function crearEspuma(){
  // busca la línea donde la playa toca el agua y la recorre con una cinta de espuma
  const pts = [];
  for (let z = -320; z <= 320; z += 3){
    let x = -140;
    while (x > -330 && alturaBaseH(x, z) > NIVEL_MAR) x -= 1;
    if (x > -330) pts.push(new THREE.Vector2(x, z));
  }
  const pos = [], uv = [], idx = [];
  pts.forEach((p, i) => {
    pos.push(p.x + 2.2, NIVEL_MAR + .04, p.y, p.x - 2.6, NIVEL_MAR + .04, p.y);
    uv.push(i * .3, 0, i * .3, 1);
    if (i){ const k = (i - 1) * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: true,
    uniforms: { ...THREE.UniformsLib.fog, uTime: U.uTime },
    vertexShader: `varying vec2 vUv;
      #include <fog_pars_vertex>
      void main(){ vUv = uv; vec4 mvPosition = modelViewMatrix * vec4(position, 1.); gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform float uTime; varying vec2 vUv;
      #include <fog_pars_fragment>
      void main(){
        float ola = fract(vUv.y * 1.2 - uTime * .18 + sin(vUv.x * .7) * .15);
        float a = smoothstep(.0, .1, ola) * smoothstep(.45, .15, ola) * (1. - vUv.y * .5);
        a *= .55 + .45 * sin(vUv.x * 2.1 + uTime * .6);
        gl_FragColor = vec4(vec3(.97, .99, 1.), a * .8);
        #include <fog_fragment>
      }`
  });
  scene.add(new THREE.Mesh(g, m));
}
/* ── Concha (abanico con costillas) y caracol (espiral) ── */
function crearConcha(){
  const g = new THREE.CircleGeometry(.5, 18, 0, Math.PI);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){

function crearCaracol(){
  const perfil = []; for (let i = 0; i <= 8; i++){ const t = i / 8; perfil.push(new THREE.Vector2(.05 * Math.sin(Math.PI * Math.pow(t, .7)) + .004, t * .13)); }
  const g = new THREE.LatheGeometry(perfil, 10);

/* ── Rayos de luz entre los árboles del bosque ───────────────────── */

  const gv = x.createLinearGradient(0, 0, 0, 256); gv.addColorStop(0, 'rgba(255,255,255,0)'); gv.addColorStop(.25, 'rgba(255,255,255,.9)'); gv.addColorStop(1, 'rgba(255,255,255,0)');
